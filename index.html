function openDriverForm(d) {
  const isEdit = !!d;
  openModal(`
    <h2>${isEdit ? 'تعديل' : 'جديد'} سائق <button class="close" onclick="closeModal()">✕</button></h2>
    <label>الاسم *</label><input id="d_name" value="${esc(d?.full_name || '')}">
    <label>الموبايل *</label><input id="d_phone" dir="ltr" type="tel" inputmode="numeric" maxlength="11" required value="${esc(d?.phone || '')}" placeholder="01012345678">
    <div class="row"><button class="btn pri big" id="d_save">حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>
  `);
  $('d_save').onclick = async () => {
    const driverName = $('d_name').value.trim();
    const driverPhone = $('d_phone').value.trim();
    if (driverName.length < 2 || driverName.length > 100) { toast('اكتب اسم السائق من حرفين إلى 100 حرف', 'err'); shake($('mod')); return; }
    if (!/^01[0125][0-9]{8}$/.test(driverPhone)) { toast('رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 010 أو 011 أو 012 أو 015', 'err'); shake($('mod')); return; }
    const payload = {
      full_name: driverName,
      phone: driverPhone,
      is_active: d?.is_active !== false,
      availability: d?.availability || 'available'
    };
    try {
      const { error } = isEdit
        ? await sb.from('drivers').update(payload).eq('id', d.id)
        : await sb.from('drivers').insert(payload);
      if (error) throw error;

VIEWS.reports = async v => {
  const all = [...ORD.values()];
  const periods = {
    today: { label:'اليوم', start: todayStart(), end: Date.now() + 864e5 },
    yesterday: { label:'أمس', start: yesterdayStart(), end: todayStart() },
    week: { label:'آخر 7 أيام', start: todayStart() - 6*864e5, end: Date.now() + 864e5 },
    month: { label:'آخر 30 يوم', start: todayStart() - 29*864e5, end: Date.now() + 864e5 },
    all: { label:'الكل', start: 0, end: Date.now() + 864e5 }
  };
  const cur = localStorage.getItem('sb_report_period') || 'week';
  const period = periods[cur];

  const filtered = all.filter(o => {
    const t = new Date(o.created_at).getTime();
    return t >= period.start && t < period.end && countable(o);
  });

  const totalRev = filtered.reduce((s, o) => s + Number(o.total || 0), 0);
  const totalCnt = filtered.length;
  const avgOrder = totalCnt ? totalRev / totalCnt : 0;

  const items = {};
  filtered.forEach(o => (o.order_items || []).forEach(i => {
    const n = i.item_name || i.name || '—';
    const k = i.item_id || n;
    if (!items[k]) items[k] = { n, qty: 0, rev: 0 };
    items[k].qty += (i.quantity || 1);
    items[k].rev += Number(i.unit_price ?? i.price ?? 0) * (i.quantity || 1);
  }));
  const topByQty = Object.values(items).sort((a, b) => b.qty - a.qty).slice(0, 8);
  const topByRev = Object.values(items).sort((a, b) => b.rev - a.rev).slice(0, 8);

  const paySum = {};
  filtered.forEach(o => {
    const k = String(o.payment_method || 'cash').toLowerCase();
    paySum[k] = (paySum[k] || 0) + Number(o.total || 0);
  });

  const days = Array(7).fill(0), dayLabels = [];
  const dayStart = todayStart() - 6 * 864e5;
  for (let i = 0; i < 7; i++) {
    const d = new Date(dayStart + i * 864e5);
    dayLabels.push(d.toLocaleDateString('ar-EG', { weekday:'short' }));
  }
  all.filter(countable).forEach(o => {
    const d = new Date(o.created_at);
    const idx = Math.floor((d.setHours(0,0,0,0) - dayStart) / 864e5);
    if (idx >= 0 && idx < 7) days[idx] += Number(o.total || 0);
  });

  // Driver performance
  const driverStats = {};
  filtered.forEach(o => {
    if (!o.assigned_driver_id) return;
    if (!driverStats[o.assigned_driver_id]) driverStats[o.assigned_driver_id] = { count:0, rev:0 };
    driverStats[o.assigned_driver_id].count++;
    driverStats[o.assigned_driver_id].rev += Number(o.total || 0);
  });
  const topDrivers = Object.entries(driverStats)
    .map(([id, s]) => ({ id, name: driverName(id), ...s }))
    .sort((a, b) => b.count - a.count).slice(0, 5);

  // Retention
  const customerOrders = {};
  all.filter(o => countable(o)).forEach(o => {
    const cid = o.user_id || o.customer_phone;
    if (!cid) return;
    if (!customerOrders[cid]) customerOrders[cid] = 0;
    customerOrders[cid]++;
  });
  const totalCustomers = Object.keys(customerOrders).length;
  const repeatCustomers = Object.values(customerOrders).filter(n => n > 1).length;
  const retentionRate = totalCustomers ? Math.round(100 * repeatCustomers / totalCustomers) : 0;

  v.innerHTML = `
    <div class="filters">
      <select id="rp_period">
        ${Object.entries(periods).map(([k, p]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${p.label}</option>`).join('')}
      </select>
    </div>
    <div class="stats">
      <div class="stat"><small>إيراد</small><b data-s="rev" data-m="1">0</b></div>
      <div class="stat"><small>طلبات</small><b data-s="cnt">0</b></div>
      <div class="stat"><small>متوسط الطلب</small><b data-s="avg" data-m="1">0</b></div>
      <div class="stat"><small>عملاء متكررون</small><b data-s="ret">0</b>%</div>
    </div>
    <div class="chart-grid">
      <div class="chart-card"><h3>📈 7 أيام</h3><canvas id="ch-week"></canvas></div>
      <div class="chart-card"><h3>💳 طرق الدفع</h3><canvas id="ch-pay"></canvas>
        <div class="chart-legend" id="pay-legend2"></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <h3>🔥 الأكثر مبيعًا (كمية)</h3>
        ${topByQty.length ? topByQty.map((x, i) => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
            <span style="width:22px;height:22px;border-radius:6px;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900">${i+1}</span>
            <span style="flex:1;font-weight:700;font-size:13px">${esc(x.n)}</span>
            <b>${x.qty}</b>
          </div>`).join('') : '<div class="empty">لا بيانات</div>'}
      </div>
      <div class="chart-card">
        <h3>💰 الأكثر إيرادًا</h3>
        ${topByRev.length ? topByRev.map((x, i) => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
            <span style="width:22px;height:22px;border-radius:6px;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900">${i+1}</span>
            <span style="flex:1;font-weight:700;font-size:13px">${esc(x.n)}</span>
            <b>${money(x.rev)}</b>
          </div>`).join('') : '<div class="empty">لا بيانات</div>'}
      </div>
    </div>
    ${topDrivers.length ? `
    <div class="chart-card">
      <h3>🛵 أفضل السائقين</h3>
      ${topDrivers.map((x, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
          <span style="width:22px;height:22px;border-radius:6px;background:var(--warn);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900">${i+1}</span>
          <span style="flex:1;font-weight:700;font-size:13px">${esc(x.name)}</span>
          <span style="color:var(--ink2);font-size:12px">${x.count} طلب</span>
          <b>${money(x.rev)}</b>
        </div>`).join('')}
    </div>` : ''}
    <div class="chart-card">
      <h3>📥 تصدير</h3>
      <div class="row">
        <button class="btn pri" id="exp-csv">📄 CSV (الفترة)</button>
        <button class="btn out" id="exp-print">🖨️ طباعة</button>
      </div>
    </div>`;

  animateTo(document.querySelector('[data-s="rev"]'), totalRev);
  animateTo(document.querySelector('[data-s="cnt"]'), totalCnt);
  animateTo(document.querySelector('[data-s="avg"]'), Math.round(avgOrder));
  animateTo(document.querySelector('[data-s="ret"]'), retentionRate);

  requestAnimationFrame(() => {
    onChart($('ch-week'), cv => lineChart(cv, dayLabels, days, '#D9401F'));
    onChart($('ch-pay'), cv => {
      const parts = Object.entries(paySum).map(([k, val]) => ({ v: val, c: payInfo(k).c, l: payInfo(k).l, i: payInfo(k).i }));
      if (parts.length) {
        donutChart(cv, parts);
        $('pay-legend2').innerHTML = parts.map(p => `
          <div class="legend-item">
            <span class="legend-dot" style="background:${p.c}"></span>
            ${p.i} ${esc(p.l)}: <b>${moneyLTR(p.v)}</b>
          </div>`).join('');
      }
    });
  });

  $('rp_period').onchange = e => {
    localStorage.setItem('sb_report_period', e.target.value);
    go('reports');
  };
  $('exp-csv').onclick = () => exportOrdersCSV(filtered);
  $('exp-print').onclick = () => window.print();
};

function downloadCSV(rows, name) {
  const safe = c => { let t = String(c ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const csv = '\uFEFF' + rows.map(r => r.map(safe).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sheep-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('تم التصدير', 'ok');
}
function exportOrdersCSV(orders) {
  const rows = [['رقم','التاريخ','العميل','الموبايل','الدفع','حالة الدفع','الإجمالي','الحالة','السائق','السبب']];
  orders.forEach(o => rows.push([
    o.order_number ?? o.id, dt(o.created_at), o.customer_name || '',
    o.customer_phone || '', payInfo(o.payment_method).l, o.payment_status || '',
    o.total || 0, ST[o.status]?.l || o.status, driverName(o.assigned_driver_id), o.cancel_reason || ''
  ]));
  downloadCSV(rows, 'orders');
}

const RF_ST = { pending:'⏳ قيد المراجعة', approved:'✅ معتمد', paid:'💸 تم الصرف', rejected:'⛔ مرفوض' };
const refundActions = x => x.status === 'pending'
  ? '<div class="row"><button class="btn out ok sm" data-rs="approved">اعتماد</button><button class="btn out dng sm" data-rs="rejected">رفض</button></div>'
  : x.status === 'approved' ? '<button class="btn pri sm" data-rs="paid">تم الصرف</button>' : '';

function openRefundForm(o) {
  openModal(`
    <h2>استرداد #${esc(o.order_number ?? o.id)} <button class="close" onclick="closeModal()">✕</button></h2>
    <p style="color:var(--ink2);margin-bottom:8px">إجمالي الطلب: <b>${money(o.total)}</b></p>
    <label>المبلغ</label><input id="rf_amt" type="number" min="0" step="0.5" value="${Number(o.total || 0)}">
    <label>السبب *</label><input id="rf_reason">
    <div class="row"><button class="btn pri big" id="rf_save">إنشاء الطلب</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
  $('rf_save').onclick = async () => {
    const amount = parseNumber($('rf_amt').value), reason = $('rf_reason').value.trim();
    if (!(amount > 0) || !reason) return shake($('mod'));
    const { error } = await sb.rpc('create_refund', { p_order: o.id, p_amount: amount, p_reason: reason });

    closeModal(); toast('تم إنشاء طلب الاسترداد', 'ok');
    if (page === 'refunds') go('refunds');
  };
}

    await Promise.all(tables.map(async ([table,label])=>{const t0=performance.now();try{const r=await sb.from(table).select('*').limit(1);if(r.error){const e=explainError(r.error);add('إتاحة الجداول',label,'error',e.summary,Math.round(performance.now()-t0),{impact:'قد تتعطل الشاشة أو الوظيفة التي تعتمد على هذا الجدول.',cause:'فشل استعلام تجريبي محدود للقراءة.',next:e.next,original:e.original,technical:r.error.code||''});}else add('إتاحة الجداول',label,'ok','الجدول قابل للاستعلام بحساب الإدارة الحالي.',Math.round(performance.now()-t0),{next:'لا يلزم إجراء حاليًا.'});}catch(e){const x=explainError(e);add('إتاحة الجداول',label,'error',x.summary,Math.round(performance.now()-t0),{impact:'قد تتعطل الوظيفة المرتبطة بالجدول.',cause:'تعذر تنفيذ الاستعلام التجريبي.',next:x.next,original:x.original});}}));

    // Operational checks use only operational fields and never display customer contact details.
    let orders=null,drivers=null;
    await Promise.all([
      (async()=>{orders=await probe('الطلبات والتشغيل','فحص الطلبات الحديثة',()=>sb.from('orders').select('id,order_number,status,payment_method,payment_status,created_at,updated_at,assigned_driver_id,idempotency_key').order('created_at',{ascending:false}).limit(500),r=>({status:'ok',message:`تمت قراءة ${r.data?.length||0} طلبًا حديثًا كحد أقصى 500 طلب للتحقق التشغيلي.`,data:r.data||[],next:'هذا فحص لعينة حديثة وليس تقريرًا تاريخيًا شاملًا.'}),'قد تُظهر هذه الفحوصات تأخرًا في تجهيز الطلبات أو مشاكل في الدفع.');})(),
      (async()=>{drivers=await probe('التوصيل والسائقون','قراءة حالة السائقين',()=>sb.from('drivers').select('id,is_active,availability').limit(300),r=>({status:'ok',message:`تمت قراءة بيانات حالة ${r.data?.length||0} سائقًا كحد أقصى 300.`,data:r.data||[],next:'لا تُعرض أسماء السائقين أو أرقامهم في تقرير التشخيص.'}),'قد يؤدي نقص السائقين المتاحين إلى تأخر تسليم الطلبات.');})()
    ]);
    if(Array.isArray(orders)){
      const now=Date.now(),active=orders.filter(o=>['confirmed','preparing'].includes(o.status));
      const stuck=active.filter(o=>now-new Date(o.updated_at||o.created_at).getTime()>45*60*1000);
      add('الطلبات والتشغيل','طلبات مؤكدة أو قيد التحضير لأكثر من 45 دقيقة',stuck.length?'warn':'ok',stuck.length?`يوجد ${stuck.length} طلبًا لم يتغير تحديثه منذ أكثر من 45 دقيقة.`:'لا توجد طلبات مؤكدة أو قيد التحضير تجاوزت 45 دقيقة ضمن العينة الحديثة.',null,{impact:'قد يكون الطلب منسيًا أو متوقفًا في المطبخ.',cause:'المدة محسوبة من آخر تحديث مسجل، وقد لا تعكس التأخير إذا كان حقل التحديث لا يتغير مع كل انتقال.',next:'افتح الطلبات المتأخرة وتأكد من حالتها مع فريق المطبخ. عتبة 45 دقيقة معيار تنبيه قابل للتعديل.'});
      const ready=orders.filter(o=>o.status==='ready'),readyUnassigned=ready.filter(o=>!o.assigned_driver_id);
      add('التوصيل والسائقون','طلبات جاهزة دون سائق معيّن',readyUnassigned.length?'warn':'ok',readyUnassigned.length?`هناك ${readyUnassigned.length} طلبًا جاهزًا دون سائق معيّن من أصل ${ready.length} طلبًا جاهزًا.`:`لا توجد طلبات جاهزة غير مسندة ضمن العينة (${ready.length} جاهز).`,null,{impact:'قد تنتظر الطلبات الجاهزة وقتًا أطول قبل خروجها للتوصيل.',cause:'لم يتم تعيين سائق لبعض الطلبات الجاهزة.',next:'راجع شاشة الطلبات والسائقين وعيّن سائقًا متاحًا عند الحاجة.'});

      const oldVisa=orders.filter(o=>o.payment_method==='visa'&&o.payment_status==='pending'&&now-new Date(o.created_at).getTime()>15*60*1000);
      add('الدفع والمعاملات','طلبات بطاقة معلّقة لأكثر من 15 دقيقة',oldVisa.length?'warn':'ok',oldVisa.length?`هناك ${oldVisa.length} طلبًا للدفع بالبطاقة ما زال معلّقًا لأكثر من 15 دقيقة.`:'لا توجد طلبات بطاقة معلّقة تجاوزت 15 دقيقة ضمن العينة.',null,{impact:'قد يكون إشعار الدفع تأخر أو أن العميل لم يكمل الدفع.',cause:'الحالة في جدول الطلبات لا تكشف وحدها نتيجة مزود الدفع.',next:'راجع سجل بوابة الدفع وإشعارات الخادم قبل اعتبار العملية مدفوعة أو فاشلة.'});
      const keys=orders.filter(o=>o.idempotency_key).map(o=>o.idempotency_key),counts={};keys.forEach(k=>counts[k]=(counts[k]||0)+1);const dup=Object.values(counts).filter(n=>n>1).reduce((a,n)=>a+n-1,0);
      add('سلامة الطلبات','مفاتيح منع تكرار الطلبات',dup?'warn':'ok',dup?`ظهر ${dup} تكرارًا لمفتاح منع التكرار ضمن آخر ${orders.length} طلبًا.`:'لم تظهر مفاتيح منع تكرار مكررة ضمن العينة التي تمت قراءتها.',null,{impact:'التكرار قد يشير إلى مشكلة في منع إعادة إرسال الطلب، لكنه لا يثبت وحده أن العميل دفع أو استلم مرتين.',cause:'قد يكون هناك إرسال مكرر أو نقص في قيد التفرد أو سلوك إعادة محاولة.',next:'راجع قيد التفرد وآلية إنشاء الطلب قبل إجراء أي حذف أو تعديل.'});
      if(Array.isArray(drivers)){
        const activeDrivers=drivers.filter(d=>d.is_active===true),available=activeDrivers.filter(d=>String(d.availability||'').toLowerCase()==='available').length;
        add('التوصيل والسائقون','مؤشر توفر السائقين',ready.length>0&&available===0?'warn':'info',ready.length>0&&available===0?`هناك ${ready.length} طلبًا جاهزًا ولا يوجد سائق نشط حالته النصية available ضمن العينة.`:`عدد السائقين النشطين: ${activeDrivers.length}، وعدد من حالتهم available حرفيًا: ${available}.`,null,{impact:'قد يساعد المؤشر في اكتشاف ضغط التوصيل.',cause:'تعتمد النتيجة على القيمة النصية الفعلية لحالة السائق؛ القيم الأخرى لا تُفسّر على أنها متاح.',next:'راجع صفحة السائقين للتأكد من حالات التوفر الفعلية. هذا مؤشر مساعد وليس حكمًا نهائيًا على القدرة التشغيلية.'});

    // Explicitly mark checks that require trusted server-side APIs or external provider access.
    const notAvailable=[
      ['البنية التحتية','صلاحية النطاق وشهادة الأمان','لا يمكن تأكيد تاريخ انتهاء النطاق أو الشهادة من داخل لوحة الإدارة وحدها.','اربط مراقبة خادمية لفحص DNS وشهادة TLS والتنبيه قبل الانتهاء.'],
      ['البنية التحتية','استهلاك قاعدة البيانات والتخزين','لم يتم جلب الحصص الفعلية أو حدود الباقة في هذا الفحص.','استخدم بيانات الاستخدام من Supabase أو واجهة مراقبة خادمية، ونبّه عند 80% من الحد.'],
      ['البنية التحتية','ضغط اتصالات PostgreSQL','لا تتوفر قراءة موثوقة لعدد الاتصالات والحد الأقصى من متصفح الإدارة.','راقب الاتصالات من سجلات/مقاييس قاعدة البيانات، ولا تعتمد على استعلامات المتصفح لتقدير الحد.'],

      ['الأمان المتقدم','محاولات الدخول والحظر المؤقت','لا تتوفر في هذا الفحص إحصاءات موثوقة لمحاولات الدخول حسب الحساب أو عنوان الشبكة.','اجمع مؤشرات المصادقة من سجلات موثوقة مع إخفاء البيانات الحساسة وتحديد معدل المحاولات.'],
      ['الأمان المتقدم','نسبة تفعيل التحقق بخطوتين','لم يتم التحقق من حالة التحقق متعدد العوامل لكل حساب إداري.','افحص عوامل المصادقة من واجهة الإدارة الخادمية، واعرض النسبة دون كشف أسرار المستخدمين.'],
      ['أمان البيانات','تغطية سياسات RLS لجميع الجداول','نجاح قراءة الجداول لا يثبت أن سياسات الأمان تمنع الوصول غير المصرح به.','راجع نتائج مستشاري Supabase واختبارات الصلاحيات لكل دور، بما فيها مستخدم غير إداري.']
    ];
    notAvailable.forEach(([cat,name,message,next])=>add(cat,name,'info',message,null,{impact:'هذه نقطة مراقبة مهمة لم تُثبت حالتها بعد.',cause:'الفحص الحالي لا يملك مصدرًا آمنًا وموثوقًا لهذه المعلومة.',next}));

    const statusRank={error:0,warn:1,info:2,ok:3},bad=items.filter(i=>i.status==='error').length,warns=items.filter(i=>i.status==='warn').length,passed=items.filter(i=>i.status==='ok').length,unknown=items.filter(i=>i.status==='info').length;

    const statusLabel={ok:'سليم',warn:'تحذير',error:'خطر / فشل',info:'غير مفحوص'};
    const statusIcon={ok:'✅',warn:'⚠️',error:'🛑',info:'ℹ️'};

    advisoryBox.innerHTML=`<section class="set-card" style="margin:14px 0;padding:14px;border-inline-start:4px solid var(--warn,var(--ink2))"><h3 style="margin-top:0">🔐 تنبيهات الأمان من آخر مراجعة</h3><p style="line-height:1.9">التنبيهات التالية ملخص نتائج مراجعة قاعدة البيانات المتاحة وقت إعداد هذه النسخة، وليست فحصًا مباشرًا جديدًا عند كل ضغطة. راجع النتائج الحالية من لوحة Supabase قبل اتخاذ أي قرار.</p><div style="line-height:1.9"><p><b>1. دوال ذات صلاحيات مرتفعة:</b> ظهر تنبيه بشأن دوال <code>SECURITY DEFINER</code> التي يمكن للحسابات المسجلة استدعاؤها. قد يكون ذلك مقصودًا، لكنه يتطلب مراجعة تحقق الهوية والصلاحية داخل كل دالة. لا تسحب الصلاحيات عشوائيًا.</p><p><b>2. جدول داخلي بلا سياسات وصول:</b> ظهر تنبيه بأن <code>private.secret_menu_sessions</code> لديه حماية الصفوف مفعّلة لكن لا توجد سياسات. يجب مراجعة طريقة وصول الدوال الخادمية إليه قبل تعديل الحماية.</p><p><b>3. كلمات المرور المسرّبة:</b> راجع إعدادات حماية كلمات المرور في المصادقة للتأكد من تفعيلها إذا كانت متاحة في باقتك.</p></div><p><a href="https://supabase.com/dashboard/project/gwufhitzmupyumdjabnj/editor" target="_blank" rel="noopener">فتح محرر قاعدة البيانات</a> · <a href="https://supabase.com/dashboard/project/gwufhitzmupyumdjabnj/auth/providers" target="_blank" rel="noopener">إعدادات تسجيل الدخول</a> · <a href="https://supabase.com/docs/guides/database/database-linter?lint=0029_authenticated_security_definer_function_executable" target="_blank" rel="noopener">شرح تنبيه الدوال</a></p><p style="font-size:12px;color:var(--ink2);margin-bottom:0">تنبيه: لا يتم عرض أعداد ثابتة قديمة على أنها نتائج حية. يلزم تشغيل مستشاري الأمان مجددًا للحصول على الحالة الحالية.</p></section>`;

    const applyFilter=()=>{const q=($('health-search')?.value||'').trim().toLowerCase(),f=$('health-filter')?.value||'all';document.querySelectorAll('[data-health-item]').forEach(el=>{const show=(f==='all'||el.dataset.status===f)&&(!q||(el.dataset.search||'').includes(q));el.style.display=show?'':'none';});document.querySelectorAll('[data-health-group]').forEach(g=>{const visible=[...g.querySelectorAll('[data-health-item]')].some(el=>el.style.display!=='none');g.style.display=visible?'':'none';});};

  try{await runCheck();}catch(e){const body=$('health-body');const x=explainError(e);if(body)body.innerHTML=`<div class="set-card" style="padding:14px;border-inline-start:4px solid var(--err)"><h3>تعذر إكمال الفحص</h3><p>${escText(x.summary)}</p><p><b>رسالة الخطأ الأصلية:</b></p><pre dir="ltr" style="white-space:pre-wrap;overflow-wrap:anywhere">${escText(x.original||String(e))}</pre><p><b>الحل المقترح:</b> ${escText(x.next)}</p></div>`;}
};

   البلوكات (homepage_blocks + homepage_block_items)، البنرات (homepage_banners)،
   الإعلانات النصية (homepage_announcements).
   - كل القراءات من Supabase، ولا توجد بيانات ثابتة أو احتياطية.
   - كل عملية كتابة تتحقق من الاستجابة (select) ثم يُعاد تحميل القائمة من قاعدة البيانات.
   - سياسات RLS الحالية تسمح بالكتابة للمالك والمدير فقط (OM)، ولم نغيّرها.
   ═══════════════════════════════════════════════════ */
const HP_TABS = [['blocks','🧱 البلوكات'], ['banners','🖼️ البنرات'], ['announcements','📢 الإعلانات النصية']];
const HP_BLOCK_TYPES = {
  product_carousel:'شريط منتجات', campaign_hero:'واجهة حملة', promo_banner:'بانر ترويجي',
  text_promo:'نص ترويجي', category_grid:'شبكة تصنيفات', product_grid:'شبكة منتجات', promotion_cards:'بطاقات عروض'
};
const HP_LAYOUTS = { text:'نص', grid:'شبكة', cards:'بطاقات', carousel:'شريط متحرك', banner:'بانر' };
const HP_ITEM_TYPES = { product:'منتج', category:'تصنيف', promotion:'عرض' };
const HP_BANNER_TARGETS = { url:'رابط خارجي', product:'منتج', category:'تصنيف', promotion:'عرض' };
const HP_ANN_PLACEMENTS = { top:'أعلى الصفحة', below_hero:'أسفل الواجهة', between_blocks:'بين البلوكات', above_footer:'أعلى الفوتر' };
const HP_ANN_TARGETS = { none:'بدون وجهة', category:'تصنيف', promotion:'عرض' };
const HP_FILTERS = [['all','الكل'], ['active','نشط'], ['upcoming','قادم'], ['expired','منتهٍ'], ['inactive','موقوف']];

const hpState = { tab: 'blocks', filter: { blocks: 'all', banners: 'all', announcements: 'all' } };

/* ---------- أدوات مساعدة ---------- */
function hpErrMsg(e) {
  const m = String((e && e.message) || e || '');
  if (/row-level security|permission denied|42501/i.test(m)) return 'ليست لديك صلاحية لتنفيذ هذه العملية (سياسات الأمان تمنع الكتابة لهذا الحساب).';
  if (/duplicate key|23505|unique/i.test(m)) return 'هذا السجل موجود بالفعل ولا يمكن تكراره.';
  if (/check constraint|23514/i.test(m)) return 'القيمة المدخلة لا تطابق قواعد قاعدة البيانات.';
  return m || 'حدث خطأ غير متوقع';
}
function hpToLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function hpFromLocal(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d) ? 'INVALID' : d.toISOString();
}
function hpIsHttps(u) {
  try { const x = new URL(u); return x.protocol === 'https:'; } catch (_) { return false; }
}
function hpIsHex(c) { return !c || /^#[0-9a-fA-F]{6}$/.test(c); }
function hpStatus(row) {
  if (!row.is_active) return { l: 'موقوف', c: 'var(--ink2)', k: 'inactive' };
  const now = Date.now();
  if (row.starts_at && new Date(row.starts_at).getTime() > now) return { l: 'قادم', c: 'var(--info)', k: 'upcoming' };
  if (row.ends_at && new Date(row.ends_at).getTime() <= now) return { l: 'منتهٍ', c: 'var(--err)', k: 'expired' };
  return { l: 'نشط', c: 'var(--ok)', k: 'active' };
}
const hpBadge = s => `<span class="pay-badge" style="color:${s.c};border-color:${s.c}55;background:${s.c}12">${s.l}</span>`;
function hpFilterBar(tab) {
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
    <label style="margin:0;font-size:13px;color:var(--ink2)">عرض:</label>
    <select data-hp-filter="${tab}" style="width:auto;min-width:140px">
      ${HP_FILTERS.map(([k, l]) => `<option value="${k}" ${hpState.filter[tab] === k ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    ${hpState.filter[tab] !== 'all' ? '<small style="color:var(--warn)">ترتيب الأسهم متاح عند عرض «الكل» فقط</small>' : ''}
  </div>`;
}
function hpApplyFilter(tab, rows) {
  const f = hpState.filter[tab];
  return f === 'all' ? rows : rows.filter(r => hpStatus(r).k === f);
}
function hpByOrder(rows) {
  return [...rows].sort((a, b) => (a.sort_order - b.sort_order) || String(a.created_at).localeCompare(String(b.created_at)));
}

/* كتابة آمنة: تتحقق من أن الصف فعلًا تحدّث (RLS قد يرفض بصمت بدون خطأ) */
async function hpUpdate(table, id, patch) {
  const r = await sb.from(table).update(patch).eq('id', id).select('id');
  if (r.error) throw r.error;
  if (!r.data || r.data.length === 0) throw new Error('لم يتم الحفظ: السجل غير موجود أو ليست لديك صلاحية');
  return true;
}
/* ترتيب: يبدّل موضع الصف مع جاره ثم يعيد كتابة sort_order للقائمة كلها بقيم متتالية */
async function hpMove(table, rows, id, dir) {
  const arr = hpByOrder(rows);
  const i = arr.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  for (let k = 0; k < arr.length; k++) {
    const want = (k + 1) * 10;
    if (arr[k].sort_order !== want) await hpUpdate(table, arr[k].id, { sort_order: want });
  }
  return true;
}

/* ---------- تحميل البيانات من Supabase ---------- */
async function hpLoadLookups() {
  const [items, cats, promos] = await Promise.all([
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('categories').select('id,name_ar').order('name_ar'),
    sb.from('menu_promotions').select('id,name_ar').order('name_ar')
  ]);
  for (const r of [items, cats, promos]) if (r.error) throw r.error;
  return {
    product: items.data || [], category: cats.data || [], promotion: promos.data || []
  };
}
function hpNameOf(lookups, type, id) {
  const list = lookups[type] || [];
  const f = list.find(x => x.id === id);
  return f ? f.name_ar : '(غير موجود)';
}
async function hpLoadBlocks() {
  const [b, it] = await Promise.all([
    sb.from('homepage_blocks').select('*').order('sort_order'),
    sb.from('homepage_block_items').select('id,block_id')
  ]);
  if (b.error) throw b.error;
  if (it.error) throw it.error;
  const counts = {};
  (it.data || []).forEach(x => { counts[x.block_id] = (counts[x.block_id] || 0) + 1; });
  return { rows: b.data || [], counts };
}
async function hpLoadTable(table) {
  const r = await sb.from(table).select('*').order('sort_order');
  if (r.error) throw r.error;
  return r.data || [];
}

/* ---------- الشاشة الرئيسية للقسم ---------- */
VIEWS.homepage = async v => {
  v.innerHTML = `
    <div class="set-card" style="margin-bottom:14px">
      <h3>🏠 إدارة الصفحة الرئيسية</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.9;margin:0">
        كل ما يظهر هنا يُقرأ مباشرة من قاعدة البيانات، وكل تعديل يُحفظ فيها. العنصر الموقوف أو خارج فترة الجدولة لا يظهر للعميل.
      </p>
    </div>
    <div role="tablist" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${HP_TABS.map(([k, l]) => `<button class="btn sm ${hpState.tab === k ? 'pri' : 'out'}" data-hp-tab="${k}" role="tab" aria-selected="${hpState.tab === k}">${l}</button>`).join('')}
    </div>
    <div id="hp-body"><div class="sk"></div><div class="sk"></div></div>`;
  v.querySelectorAll('[data-hp-tab]').forEach(b => b.onclick = () => { hpState.tab = b.dataset.hpTab; VIEWS.homepage(v); });
  await hpRenderTab(v.querySelector('#hp-body'), v);
};

async function hpRenderTab(body, v) {
  try {
    if (hpState.tab === 'blocks') await hpRenderBlocks(body, v);
    else if (hpState.tab === 'banners') await hpRenderBanners(body, v);
    else await hpRenderAnnouncements(body, v);
  } catch (e) {
    console.error(e);
    body.innerHTML = `<div class="empty">تعذر تحميل البيانات من قاعدة البيانات: ${esc(hpErrMsg(e))}
      <div style="margin-top:10px"><button class="btn out sm" onclick="VIEWS.homepage($('view'))">إعادة المحاولة</button></div></div>`;
  }
}

/* ═══════════ البلوكات ═══════════ */
async function hpRenderBlocks(body, v) {
  const [{ rows, counts }, lookups] = await Promise.all([hpLoadBlocks(), hpLoadLookups()]);
  const ordered = hpByOrder(rows);
  const visible = hpApplyFilter('blocks', ordered);
  body.innerHTML = `
    <div class="row" style="margin-bottom:12px"><button class="btn pri" id="hp-block-add">+ بلوك جديد</button></div>
    ${hpFilterBar('blocks')}
    <div class="table-wrap">
      ${visible.length === 0 ? '<div class="empty">لا توجد بلوكات مطابقة في قاعدة البيانات</div>' : visible.map((b, idx) => {
        const st = hpStatus(b);
        const canMove = hpState.filter.blocks === 'all';
        const pos = ordered.findIndex(x => x.id === b.id);
        return `<div class="set-card" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
            <div><b>${esc(b.title_ar || '(بدون عنوان)')}</b> ${hpBadge(st)}</div>
            <small style="color:var(--ink2)">ترتيب: ${b.sort_order}</small>
          </div>
          <div style="font-size:12px;color:var(--ink2);margin:6px 0">
            النوع: ${esc(HP_BLOCK_TYPES[b.block_type] || b.block_type)} · العرض: ${esc(HP_LAYOUTS[b.layout_type] || b.layout_type)} · العناصر: ${counts[b.id] || 0}
          </div>
          ${b.subtitle_ar ? `<div style="font-size:12px;margin-bottom:6px">${esc(b.subtitle_ar)}</div>` : ''}
          <div style="font-size:11px;color:var(--ink2)">أُنشئ: ${dt(b.created_at)} · عُدّل: ${dt(b.updated_at)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
            ${canMove ? `<button class="btn out sm" data-act="up" data-id="${b.id}" ${pos === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
            <button class="btn out sm" data-act="down" data-id="${b.id}" ${pos === ordered.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>` : ''}
            <button class="btn out sm" data-act="items" data-id="${b.id}">🧩 العناصر (${counts[b.id] || 0})</button>
            <button class="btn out sm" data-act="edit" data-id="${b.id}">✏️ تعديل</button>
            <button class="btn out sm ${b.is_active ? 'wr' : 'ok'}" data-act="toggle" data-id="${b.id}">${b.is_active ? 'إيقاف' : 'تفعيل'}</button>
            <button class="btn out sm dng" data-act="delete" data-id="${b.id}">🗑️ حذف</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  $('hp-block-add').onclick = () => hpBlockEditor(null, ordered, lookups, v);
  body.querySelector('[data-hp-filter]').onchange = e => { hpState.filter.blocks = e.target.value; VIEWS.homepage(v); };

  body.onclick = async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const row = rows.find(r => r.id === id);
    if (!row && btn.dataset.act !== 'items') return;
    const act = btn.dataset.act;
    try {
      if (act === 'up' || act === 'down') {
        btn.disabled = true;
        await hpMove('homepage_blocks', rows, id, act === 'up' ? -1 : 1);
        toast('تم تحديث الترتيب في قاعدة البيانات', 'ok');
      } else if (act === 'toggle') {
        btn.disabled = true;
        await hpUpdate('homepage_blocks', id, { is_active: !row.is_active });
        toast(row.is_active ? 'تم إيقاف البلوك' : 'تم تفعيل البلوك', 'ok');
      } else if (act === 'edit') {
        hpBlockEditor(row, ordered, lookups, v); return;
      } else if (act === 'items') {
        hpBlockItems(row, lookups, v); return;
      } else if (act === 'delete') {
        if (!await ask('حذف البلوك', `سيتم حذف البلوك «${row.title_ar || ''}» وكل عناصره نهائيًا. هل أنت متأكد؟`, 'حذف')) return;
        const r = await sb.from('homepage_blocks').delete().eq('id', id).select('id');
        if (r.error) throw r.error;
        if (!r.data || r.data.length === 0) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
        toast('تم حذف البلوك', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.homepage(v); // إعادة التحميل من قاعدة البيانات دائمًا
  };
}

function hpBlockEditor(row, ordered, lookups, v) {
  const isNew = !row;
  const r = row || { block_type: 'product_grid', layout_type: 'grid', is_active: true, title_ar: '', subtitle_ar: '', starts_at: null, ends_at: null, background_color: '', text_color: '', accent_color: '' };
  openModal(`<h2>${isNew ? 'بلوك جديد' : 'تعديل البلوك'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <label>نوع البلوك *</label>
    <select id="hb_type">${Object.entries(HP_BLOCK_TYPES).map(([k, l]) => `<option value="${k}" ${r.block_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label>طريقة العرض *</label>
    <select id="hb_layout">${Object.entries(HP_LAYOUTS).map(([k, l]) => `<option value="${k}" ${r.layout_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label>العنوان</label><input id="hb_title" maxlength="120" value="${esc(r.title_ar || '')}">
    <label>الوصف</label><textarea id="hb_sub" maxlength="300">${esc(r.subtitle_ar || '')}</textarea>
    <label>بداية الظهور (اختياري)</label><input id="hb_start" type="datetime-local" value="${hpToLocal(r.starts_at)}">
    <label>نهاية الظهور (اختياري)</label><input id="hb_end" type="datetime-local" value="${hpToLocal(r.ends_at)}">
    <label>لون الخلفية (اختياري، مثال #FFFFFF)</label><input id="hb_bg" dir="ltr" value="${esc(r.background_color || '')}">
    <label>لون النص (اختياري)</label><input id="hb_fg" dir="ltr" value="${esc(r.text_color || '')}">
    <label>لون التمييز (اختياري)</label><input id="hb_ac" dir="ltr" value="${esc(r.accent_color || '')}">
    <label class="toggle" style="margin-top:12px"><span>مفعّل</span><input type="checkbox" id="hb_active" ${r.is_active ? 'checked' : ''}></label>
    <div class="row" style="margin-top:14px"><button class="btn pri big" id="hb_save">💾 حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

  $('hb_save').onclick = async () => {
    const btn = $('hb_save');
    const start = hpFromLocal($('hb_start').value), end = hpFromLocal($('hb_end').value);
    if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
    if (start && end && new Date(end) <= new Date(start)) return toast('نهاية الظهور يجب أن تكون بعد البداية', 'err');
    const bg = $('hb_bg').value.trim(), fg = $('hb_fg').value.trim(), ac = $('hb_ac').value.trim();
    if (!hpIsHex(bg) || !hpIsHex(fg) || !hpIsHex(ac)) return toast('الألوان يجب أن تكون بصيغة #RRGGBB', 'err');
    const payload = {
      block_type: $('hb_type').value,
      layout_type: $('hb_layout').value,
      title_ar: $('hb_title').value.trim() || null,
      subtitle_ar: $('hb_sub').value.trim() || null,
      starts_at: start, ends_at: end,
      background_color: bg || null, text_color: fg || null, accent_color: ac || null,
      is_active: $('hb_active').checked
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const maxOrder = ordered.reduce((m, x) => Math.max(m, x.sort_order || 0), 0);
        const ins = await sb.from('homepage_blocks').insert({ ...payload, sort_order: maxOrder + 10 }).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء البلوك');
      } else {
        await hpUpdate('homepage_blocks', row.id, payload);
      }
      closeModal();
      toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS.homepage(v);
  };
}

async function hpBlockItems(block, lookups, v) {
  const { data, error } = await sb.from('homepage_block_items').select('*').eq('block_id', block.id).order('sort_order');
  if (error) return fail(error, hpErrMsg(error));
  const items = hpByOrder(data || []);
  const taken = new Set(items.map(i => i.item_type + ':' + i.target_id));
  const renderList = () => items.length === 0
    ? '<div class="empty">لا توجد عناصر في هذا البلوك</div>'
    : items.map((it, idx) => `<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line);gap:6px">
        <div style="flex:1"><b>${esc(hpNameOf(lookups, it.item_type, it.target_id))}</b>
          <small style="color:var(--ink2)"> · ${esc(HP_ITEM_TYPES[it.item_type] || it.item_type)}${it.is_active ? '' : ' · موقوف'}</small></div>
        <button class="btn out sm" data-it-act="up" data-idx="${idx}" ${idx === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
        <button class="btn out sm" data-it-act="down" data-idx="${idx}" ${idx === items.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>
        <button class="btn out sm dng" data-it-act="remove" data-idx="${idx}">إزالة</button>
      </div>`).join('');

  openModal(`<h2>عناصر: ${esc(block.title_ar || 'بلوك')} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <div id="hbi-list">${renderList()}</div>
    <h3 style="margin-top:16px;font-size:14px">إضافة عنصر</h3>
    <label>النوع</label>
    <select id="hbi_type">${Object.entries(HP_ITEM_TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
    <label>الهدف</label><select id="hbi_target"></select>
    <button class="btn pri big" id="hbi_add" style="margin-top:10px">+ إضافة</button>`);

  const fillTargets = () => {
    const t = $('hbi_type').value;
    $('hbi_target').innerHTML = (lookups[t] || []).map(x => `<option value="${x.id}">${esc(x.name_ar)}</option>`).join('') || '<option value="">لا توجد عناصر من هذا النوع</option>';
  };
  fillTargets();
  $('hbi_type').onchange = fillTargets;

  const reload = () => hpBlockItems(block, lookups, v);
  $('hbi_add').onclick = async () => {
    const type = $('hbi_type').value, target = $('hbi_target').value;
    if (!target) return toast('اختر هدفًا صالحًا', 'err');
    if (taken.has(type + ':' + target)) return toast('هذا العنصر موجود بالفعل داخل البلوك', 'err');
    const btn = $('hbi_add'); btn.disabled = true;
    try {
      const maxOrder = items.reduce((m, x) => Math.max(m, x.sort_order || 0), 0);
      const r = await sb.from('homepage_block_items').insert({ block_id: block.id, item_type: type, target_id: target, sort_order: maxOrder + 10, is_active: true }).select('id').single();
      if (r.error) throw r.error;
      toast('تمت الإضافة', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); }
    reload();
  };

  $('hbi-list').onclick = async e => {
    const b = e.target.closest('[data-it-act]');
    if (!b) return;
    const idx = Number(b.dataset.idx), act = b.dataset.itAct;
    try {
      if (act === 'remove') {
        const it = items[idx];
        if (!await ask('إزالة العنصر', 'هل تريد إزالة هذا العنصر من البلوك؟', 'إزالة')) return;
        const r = await sb.from('homepage_block_items').delete().eq('id', it.id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم تتم الإزالة: ليست لديك صلاحية أو العنصر غير موجود');
      } else {
        const dir = act === 'up' ? -1 : 1;
        const j = idx + dir;
        if (j < 0 || j >= items.length) return;
        [items[idx], items[j]] = [items[j], items[idx]];
        for (let k = 0; k < items.length; k++) {
          const want = (k + 1) * 10;
          if (items[k].sort_order !== want) await hpUpdate('homepage_block_items', items[k].id, { sort_order: want });
        }
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    reload();
  };
}

/* ═══════════ البنرات ═══════════ */
async function hpRenderBanners(body, v) {
  const [rows, lookups] = await Promise.all([hpLoadTable('homepage_banners'), hpLoadLookups()]);
  const ordered = hpByOrder(rows);
  const visible = hpApplyFilter('banners', ordered);
  const canMove = hpState.filter.banners === 'all';
  body.innerHTML = `
    <div class="row" style="margin-bottom:12px"><button class="btn pri" id="hp-banner-add">+ بانر جديد</button></div>
    ${hpFilterBar('banners')}
    ${visible.length === 0 ? '<div class="empty">لا توجد بنرات مطابقة في قاعدة البيانات</div>' : visible.map(b => {
      const st = hpStatus(b);
      const pos = ordered.findIndex(x => x.id === b.id);
      const targetLabel = b.target_type === 'url' ? (b.target_url || '—') : hpNameOf(lookups, b.target_type, b.target_id);
      return `<div class="set-card" style="margin-bottom:10px;display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start">
        <div style="width:110px;height:64px;border-radius:10px;background:var(--bg2);overflow:hidden;display:grid;place-items:center">
          ${b.image_url && hpIsHttps(b.image_url) ? `<img src="${esc(b.image_url)}" alt="${esc(b.title_ar || 'بانر')}" style="width:100%;height:100%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('small'),{textContent:'تعذر تحميل الصورة'}))">` : '<small style="color:var(--err)">رابط صورة غير صالح</small>'}
        </div>
        <div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>${esc(b.title_ar || '(بدون عنوان)')}</b> ${hpBadge(st)} <small style="color:var(--ink2)">ترتيب: ${b.sort_order}</small></div>
          <div style="font-size:12px;color:var(--ink2);margin:4px 0">الوجهة: ${esc(HP_BANNER_TARGETS[b.target_type] || b.target_type)} — ${esc(targetLabel)} · مدة العرض: ${b.display_seconds} ث</div>
          <div style="font-size:12px;color:var(--ink2)">من: ${b.starts_at ? dt(b.starts_at) : 'فورًا'} · إلى: ${b.ends_at ? dt(b.ends_at) : 'بدون نهاية'}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
            ${canMove ? `<button class="btn out sm" data-act="up" data-id="${b.id}" ${pos === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
            <button class="btn out sm" data-act="down" data-id="${b.id}" ${pos === ordered.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>` : ''}
            <button class="btn out sm" data-act="edit" data-id="${b.id}">✏️ تعديل</button>
            <button class="btn out sm ${b.is_active ? 'wr' : 'ok'}" data-act="toggle" data-id="${b.id}">${b.is_active ? 'إيقاف' : 'تفعيل'}</button>
            <button class="btn out sm dng" data-act="delete" data-id="${b.id}">🗑️ حذف</button>
          </div>
        </div>
      </div>`;
    }).join('')}`;

  $('hp-banner-add').onclick = () => hpBannerEditor(null, ordered, lookups, v);
  body.querySelector('[data-hp-filter]').onchange = e => { hpState.filter.banners = e.target.value; VIEWS.homepage(v); };
  body.onclick = async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id, act = btn.dataset.act;
    const row = rows.find(r => r.id === id);
    try {
      if (act === 'up' || act === 'down') {
        await hpMove('homepage_banners', rows, id, act === 'up' ? -1 : 1);
        toast('تم تحديث الترتيب في قاعدة البيانات', 'ok');
      } else if (act === 'toggle') {
        await hpUpdate('homepage_banners', id, { is_active: !row.is_active });
        toast(row.is_active ? 'تم إيقاف البانر' : 'تم تفعيل البانر', 'ok');
      } else if (act === 'edit') {
        hpBannerEditor(row, ordered, lookups, v); return;
      } else if (act === 'delete') {
        if (!await ask('حذف البانر', `سيتم حذف البانر «${row.title_ar || ''}» نهائيًا. هل أنت متأكد؟`, 'حذف')) return;
        const r = await sb.from('homepage_banners').delete().eq('id', id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
        toast('تم حذف البانر', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.homepage(v);
  };
}

function hpBannerEditor(row, ordered, lookups, v) {
  const isNew = !row;
  const r = row || { target_type: 'url', target_id: null, target_url: '', display_seconds: 5, is_active: true, title_ar: '', subtitle_ar: '', image_url: '', mobile_image_url: '', button_text_ar: '', starts_at: null, ends_at: null };
  const targetOptions = t => (lookups[t] || []).map(x => `<option value="${x.id}" ${r.target_id === x.id ? 'selected' : ''}>${esc(x.name_ar)}</option>`).join('');
  openModal(`<h2>${isNew ? 'بانر جديد' : 'تعديل البانر'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <label>رفع صورة من الجهاز (JPG أو PNG أو WEBP، حتى 5 ميجابايت)</label><input id="hbn_file" type="file" accept="image/jpeg,image/png,image/webp"><small id="hbn_up" style="color:var(--ink2)"></small>
    <label>رابط صورة سطح المكتب * (https)</label>
    <input id="hbn_img" dir="ltr" value="${esc(r.image_url || '')}" placeholder="https://...">
    <div id="hbn_prev" style="margin-top:8px;height:110px;border-radius:12px;background:var(--bg2);overflow:hidden;display:grid;place-items:center"><small style="color:var(--ink2)">معاينة الصورة</small></div>
    <label>رابط صورة الجوال (اختياري)</label><input id="hbn_mimg" dir="ltr" value="${esc(r.mobile_image_url || '')}">
    <label>العنوان</label><input id="hbn_title" maxlength="120" value="${esc(r.title_ar || '')}">
    <label>الوصف</label><input id="hbn_sub" maxlength="200" value="${esc(r.subtitle_ar || '')}">
    <label>نص الزر</label><input id="hbn_btn" maxlength="40" value="${esc(r.button_text_ar || '')}">
    <label>نوع الوجهة *</label>
    <select id="hbn_ttype">${Object.entries(HP_BANNER_TARGETS).map(([k, l]) => `<option value="${k}" ${r.target_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div id="hbn_url_wrap"><label>الرابط</label><input id="hbn_url" dir="ltr" value="${esc(r.target_url || '')}" placeholder="https://..."></div>
    <div id="hbn_id_wrap"><label>الهدف</label><select id="hbn_tid"></select></div>
    <label>مدة العرض بالثواني (1 - 60)</label><input id="hbn_sec" type="number" min="1" max="60" value="${r.display_seconds}">
    <label>بداية الظهور (اختياري)</label><input id="hbn_start" type="datetime-local" value="${hpToLocal(r.starts_at)}">
    <label>نهاية الظهور (اختياري)</label><input id="hbn_end" type="datetime-local" value="${hpToLocal(r.ends_at)}">
    <label class="toggle" style="margin-top:12px"><span>مفعّل</span><input type="checkbox" id="hbn_active" ${r.is_active ? 'checked' : ''}></label>
    <div class="row" style="margin-top:14px"><button class="btn pri big" id="hbn_save">💾 حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

  const syncTarget = () => {
    const t = $('hbn_ttype').value;
    $('hbn_url_wrap').classList.toggle('hide', t !== 'url');
    $('hbn_id_wrap').classList.toggle('hide', t === 'url');
    if (t !== 'url') $('hbn_tid').innerHTML = `<option value="">— اختر —</option>${targetOptions(t)}`;
  };
  syncTarget();
  $('hbn_ttype').onchange = syncTarget;

  const preview = () => {
    const u = $('hbn_img').value.trim();
    const box = $('hbn_prev');
    if (!u) { box.innerHTML = '<small style="color:var(--ink2)">معاينة الصورة</small>'; return; }
    if (!hpIsHttps(u)) { box.innerHTML = '<small style="color:var(--err)">الرابط يجب أن يبدأ بـ https://</small>'; return; }
    box.innerHTML = `<img src="${esc(u)}" alt="معاينة" style="width:100%;height:100%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='<small style=color:var(--err)>تعذر تحميل الصورة من هذا الرابط</small>'">`;
  };
  preview();
  $('hbn_img').oninput = preview;
  $('hbn_file').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) return toast('نوع الملف غير مدعوم. استخدم JPG أو PNG أو WEBP', 'err');
    if (f.size > 5 * 1024 * 1024) return toast('حجم الصورة يتجاوز 5 ميجابايت', 'err');
    const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[f.type];
    const path = `banners/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    $('hbn_up').textContent = '⏳ جاري رفع الصورة...';
    try {
      const up = await sb.storage.from('menu-images').upload(path, f, { contentType: f.type, upsert: false });
      if (up.error) throw up.error;
      const url = sb.storage.from('menu-images').getPublicUrl(path)?.data?.publicUrl;
      if (!url || !hpIsHttps(url)) throw new Error('تعذر الحصول على رابط عام للصورة');
      $('hbn_img').value = url;
      preview();
      $('hbn_up').textContent = '✅ تم رفع الصورة';
    } catch (err) { $('hbn_up').textContent = ''; fail(err, hpErrMsg(err)); }
  };

  $('hbn_save').onclick = async () => {
    const btn = $('hbn_save');
    const img = $('hbn_img').value.trim(), mimg = $('hbn_mimg').value.trim();
    const type = $('hbn_ttype').value;
    const url = $('hbn_url').value.trim();
    const tid = type === 'url' ? null : ($('hbn_tid').value || null);
    const start = hpFromLocal($('hbn_start').value), end = hpFromLocal($('hbn_end').value);
    const sec = Number($('hbn_sec').value);
    if (!img || !hpIsHttps(img)) return toast('رابط صورة سطح المكتب مطلوب ويجب أن يبدأ بـ https://', 'err');
    if (mimg && !hpIsHttps(mimg)) return toast('رابط صورة الجوال يجب أن يبدأ بـ https://', 'err');
    if (type === 'url' && (!url || !hpIsHttps(url))) return toast('الرابط الخارجي مطلوب ويجب أن يبدأ بـ https://', 'err');
    if (type !== 'url' && !tid) return toast('اختر الهدف المرتبط بالبانر', 'err');
    if (!Number.isInteger(sec) || sec < 1 || sec > 60) return toast('مدة العرض يجب أن تكون بين 1 و 60 ثانية', 'err');
    if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
    if (start && end && new Date(end) <= new Date(start)) return toast('نهاية الظهور يجب أن تكون بعد البداية', 'err');
    const payload = {
      image_url: img, mobile_image_url: mimg || null,
      title_ar: $('hbn_title').value.trim() || null, subtitle_ar: $('hbn_sub').value.trim() || null,
      button_text_ar: $('hbn_btn').value.trim() || null,
      target_type: type, target_id: tid, target_url: type === 'url' ? url : null,
      display_seconds: sec, starts_at: start, ends_at: end,
      is_active: $('hbn_active').checked
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const maxOrder = ordered.reduce((m, x) => Math.max(m, x.sort_order || 0), 0);
        const ins = await sb.from('homepage_banners').insert({ ...payload, sort_order: maxOrder + 10 }).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء البانر');
      } else {
        await hpUpdate('homepage_banners', row.id, payload);
      }
      closeModal();
      toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS.homepage(v);
  };
}

    const url = $('han_url').value.trim();
    const bg = $('han_bg').value.trim(), fg = $('han_fg').value.trim();
    const start = hpFromLocal($('han_start').value), end = hpFromLocal($('han_end').value);
    if (!msg) return toast('نص الإعلان مطلوب', 'err');
    if (type !== 'none' && !$('han_tid').value) return toast('اختر الهدف المرتبط بالإعلان', 'err');
    if (type === 'none' && url && !hpIsHttps(url)) return toast('الرابط يجب أن يبدأ بـ https://', 'err');
    if (!hpIsHex(bg) || !hpIsHex(fg)) return toast('الألوان يجب أن تكون بصيغة #RRGGBB', 'err');
    const img = $('han_img').value.trim();
    if (img && !hpIsHttps(img)) return toast('رابط الصورة يجب أن يبدأ بـ https://', 'err');
    if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
    if (start && end && new Date(end) <= new Date(start)) return toast('نهاية العرض يجب أن تكون بعد البداية', 'err');
    const payload = {
      title_ar: $('han_title').value.trim() || null,
      message_ar: msg,
      placement: $('han_pl').value,
      target_type: type,
      target_id: type === 'none' ? null : $('han_tid').value,
      target_url: type === 'none' && url ? url : null,
      background_color: bg || null, text_color: fg || null,
      is_dismissible: $('han_dis').checked,
      is_active: $('han_active').checked,
      image_url: img || null,
      starts_at: start, ends_at: end
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const maxOrder = ordered.reduce((m, x) => Math.max(m, x.sort_order || 0), 0);
        const ins = await sb.from('homepage_announcements').insert({ ...payload, sort_order: maxOrder + 10 }).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء الإعلان');
      } else {
        await hpUpdate('homepage_announcements', row.id, payload);
      }
      closeModal();
      toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS.homepage(v);
  };
}

    if ($('hc_secret_exp').value) payload.expires_at = new Date($('hc_secret_exp').value + 'T23:59:59').toISOString();
    const btn = $('hc_secret_create'); btn.disabled = true; btn.textContent = 'جارٍ إنشاء الكود…';
    try {
      await callAdmin(payload);
      openModal(`<h2>تم إنشاء الكود وربطه بالأصناف</h2><p style="line-height:1.9">انسخ الكود واحفظه الآن. لن نستطيع عرضه مرة أخرى لأن النظام يحفظ بصمته فقط.</p><input readonly dir="ltr" value="${esc(code)}" id="hc-secret-created-code"><div class="row"><button class="btn pri big" id="hc-copy-secret">نسخ الكود</button><button class="btn out big" onclick="closeModal()">إغلاق</button></div>`, true);
      $('hc-copy-secret').onclick = async () => { try { await navigator.clipboard.writeText(code); toast('تم نسخ الكود','ok'); } catch { $('hc-secret-created-code').select(); document.execCommand('copy'); toast('تم النسخ','ok'); } };
      $('hc_secret_code').value = ''; $('hc_secret_label').value = ''; $('hc_secret_max').value = ''; $('hc_secret_exp').value = '';
      v.querySelectorAll('[data-secret-item]').forEach(x=>x.checked=false);
      await renderSecretCodes();
    } catch(e) { fail(e, 'فشل إنشاء الكود أو ربط الأصناف'); }
    finally { btn.disabled = false; btn.textContent = '🔐 إنشاء الكود وربطه بالأصناف'; }
  };
  await renderSecretCodes();
};

  `;

  // Tabs
  v.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    v.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    v.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== b.dataset.tab));
    if (b.dataset.tab === 'delivery') loadZones();
  });

  // Payment chips
  v.querySelectorAll('.pay-chip').forEach(chip => {
    const cb = chip.querySelector('input');
    chip.onclick = e => { if (e.target !== cb) cb.checked = !cb.checked; chip.classList.toggle('on', cb.checked); };
  });

  // Save general
  $('s_save_general').onclick = async () => {
    const payload = {
      is_open: $('s_open').checked,
      accepting_orders: $('s_accept').checked,
      name_ar: $('s_name').value.trim(),
      contact_phone: $('s_phone').value.trim() || null,
      address_text: $('s_addr').value.trim() || null,
      logo_url: $('s_logo_url').value.trim() || null
    };
    if (!payload.name_ar) return toast('اسم المطعم مطلوب', 'err');
    await saveSettings(payload, 's_save_general');
    await saveBrandExtras();
  };

  // مزامنة اللون مع حقل النص الست عشري والعكس
  $('s_tagline_color').oninput = () => { $('s_tagline_hex').value = $('s_tagline_color').value; };
  $('s_tagline_hex').oninput = () => { const v = $('s_tagline_hex').value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v)) $('s_tagline_color').value = v; };

  // رفع لوجو المطعم إلى bucket menu-images (نفس نمط رفع البانرات) ثم ملء حقل الرابط
  // الحفظ الفعلي في store_settings.logo_url يتم بزر "حفظ" في نفس البطاقة
  $('s_logo_file').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/svg+xml': 'svg' }[f.type];
    if (!ext) return toast('نوع الملف غير مدعوم. استخدم PNG أو JPG أو WEBP أو SVG', 'err');
    if (f.size > 2 * 1024 * 1024) return toast('حجم اللوجو يتجاوز 2 ميجابايت', 'err');
    const path = `logo/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    $('s_logo_up').textContent = '⏳ جاري رفع اللوجو...';
    try {
      const up = await sb.storage.from('menu-images').upload(path, f, { contentType: f.type, upsert: false });
      if (up.error) throw up.error;
      const url = sb.storage.from('menu-images').getPublicUrl(path)?.data?.publicUrl;
      if (!url || !hpIsHttps(url)) throw new Error('تعذر الحصول على رابط عام للوجو');
      $('s_logo_url').value = url;
      $('s_logo_prev').src = url;
      $('s_logo_prev').style.display = '';
      $('s_logo_up').textContent = '✅ تم رفع اللوجو — اضغط حفظ لتطبيقه على الموقع';
    } catch (err) { $('s_logo_up').textContent = ''; fail(err, 'تعذر رفع اللوجو'); }
    finally { e.target.value = ''; }
  };
  // تحديث المعاينة لو الرابط اتكتب يدوياً
  $('s_logo_url').oninput = () => {
    const u = $('s_logo_url').value.trim();
    $('s_logo_prev').src = u || '';
    $('s_logo_prev').style.display = u ? '' : 'none';
  };
  $('s_save_delivery').onclick = async () => {
    const payload = {
      delivery_fee: parseNumber($('s_delivery').value) || 0,
      min_order: parseNumber($('s_min').value) || 0,
      free_delivery_threshold: Number.isFinite(parseNumber($('s_freedel').value)) && parseNumber($('s_freedel').value) > 0 ? parseNumber($('s_freedel').value) : null
    };
    await saveSettings(payload, 's_save_delivery');
  };
  $('s_save_menu_display').onclick = async () => {
    const payload = {
      show_popular_filter: $('s_show_popular').checked,
      show_spicy_filter: $('s_show_spicy').checked,
      show_vegetarian_filter: $('s_show_vegetarian').checked,
      show_free_delivery_filter: $('s_show_free_delivery').checked
    };
    await saveSettings(payload, 's_save_menu_display');
  };
  // تحميل الأصناف المتاحة لاختيار الشيف
  const chefSelect = $('s_chef_item');
  if (chefSelect) {
    const { data: chefItems, error: chefItemsError } = await sb.from('menu_items').select('id,name_ar,is_secret,is_available').eq('is_available', true).eq('is_secret', false).order('name_ar');
    if (chefItemsError) toast('تعذر تحميل المنتجات لاختيار الشيف', 'err');
    (chefItems || []).forEach(it => chefSelect.add(new Option(it.name_ar, it.id)));
    chefSelect.value = s.chef_special_item_id || '';
  }
  $('s_save_chef').onclick = async () => {
    const discountPct = parseNumber($('s_chef_discount').value);
    if (chefSelect.value && !(discountPct >= 1 && discountPct <= 99)) return toast('اكتب خصمًا من 1 إلى 99 بالمئة', 'err');
    await saveSettings({
      chef_special_item_id: chefSelect.value || null,
      chef_special_discount: (discountPct >= 1 && discountPct <= 99 ? discountPct : 25) / 100
    }, 's_save_chef');
  };
  $('s_save_payments').onclick = async () => {
    const payload = {};
    ['cash','visa','wallet'].forEach(k => {
      payload[k + '_enabled'] = $('s_p_' + k).checked;
    });
    if (payload.cash_enabled === false && !confirm('تعطيل الدفع النقدي سيوقف كل الطلبات من تطبيق العميل لأنه الطريقة الوحيدة المتاحة له. هل تريد المتابعة؟')) return;
    await saveSettings(payload, 's_save_payments');
  };
  $('s_save_loyalty').onclick = async () => {
    const pts = parseNumber($('l_pts').value), redeemPts = parseNumber($('l_redeem_points').value), rewardValue = parseNumber($('l_reward').value);
    if (!(pts > 0 && pts <= 100 && redeemPts >= 1 && rewardValue > 0)) return toast('راجع قيم النقاط والمكافأة', 'err');
    await saveLoyalty({ loyalty_enabled: $('l_active').checked, loyalty_points_per_currency: pts, loyalty_redeem_points: Math.trunc(redeemPts), loyalty_redeem_value: rewardValue }, 's_save_loyalty');
  };
  const loadStampRewardItems = async () => {
    const select = $('l_stamp_item'); if (!select) return;
    const { data, error } = await sb.from('menu_items').select('id,name_ar,is_available,is_secret').eq('is_available', true).eq('is_secret', false).order('name_ar');
    if (error) { select.innerHTML = '<option value="">تعذر تحميل أصناف المنيو</option>'; return; }
    select.innerHTML = '<option value="">— بدون مكافأة صنف مجانية —</option>' + (data || []).map(x => `<option value="${x.id}" ${x.id === l.stamp_reward_item_id ? 'selected' : ''}>${esc(x.name_ar)}</option>`).join('');
  };
  loadStampRewardItems();
  $('s_save_stamp').onclick = async () => {
    const stamps = Math.trunc(parseNumber($('l_stamps').value));
    if (!(stamps >= 2 && stamps <= 100)) return toast('عدد الأختام يجب أن يكون من 2 إلى 100', 'err');
    const itemId = $('l_stamp_item').value || null;
    await saveLoyalty({ loyalty_stamps_for_reward: stamps, loyalty_stamp_reward_item_id: itemId }, 's_save_stamp');
  };

  // Achievement management: backed by public.achievements and customer delivery trigger.
  const achConditions = {first_order:'أول طلب مكتمل',delivered_orders:'عدد الطلبات المكتملة',total_spend:'إجمالي المشتريات',burger_quantity:'عدد قطع البرجر',vegetarian_orders:'طلبات الأصناف النباتية',night_order:'طلب ليلي',secret_item:'صنف من القائمة السرية',all_spicy_items:'كل الأصناف الحارة'};
  let achRows = [];
  const achEscape = x => String(x ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));

  await loadAchievements(); await loadEarnedAchievements();

    host.querySelectorAll('[data-reward-edit]').forEach(btn=>btn.onclick=()=>openRewardEditor(rows.find(x=>x.id===btn.dataset.rewardEdit)));
    host.querySelectorAll('[data-reward-toggle]').forEach(btn=>btn.onclick=async()=>{const row=rows.find(x=>x.id===btn.dataset.rewardToggle);if(!row)return;try{await callRewardAdmin({action:'save_reward_prize',...row,is_active:btn.dataset.active!=='true'});toast('تم تحديث حالة الجائزة','ok');loadRewardPrizes();}catch(error){fail(error);}});

// حفظ العنوان الفرعي ولونه في app_content، وإحداثيات المطعم في store_settings
async function saveBrandExtras() {
  const tagline = $('s_tagline').value.trim();
  const meta = $('s_meta').value.trim();
  const hex = $('s_tagline_hex').value.trim() || $('s_tagline_color').value;
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return toast('لون العنوان الفرعي لازم يكون بصيغة #RRGGBB', 'err');
  const latRaw = $('s_lat').value.trim(), lngRaw = $('s_lng').value.trim();
  const lat = latRaw === '' ? null : Number(latRaw);
  const lng = lngRaw === '' ? null : Number(lngRaw);
  if ((lat === null) !== (lng === null)) return toast('لازم تدخل خط العرض وخط الطول مع بعض أو تسيبهم الاتنين فاضيين', 'err');
  if (lat !== null && (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lng) || lng < -180 || lng > 180)) return toast('الإحداثيات خارج النطاق الصحيح', 'err');
  try {
    await upsertBrandRow('tagline', tagline, { color: hex }, BRAND_ROW);
    await upsertBrandRow('meta_description', meta, {}, BRAND_META_ROW);
    const sr = await sb.from('store_settings').update({ latitude: lat, longitude: lng }).eq('id', CONFIG.SETTINGS_ROW_ID).select('id').single();
    if (sr.error) throw sr.error;
    toast('تم حفظ هوية المطعم', 'ok');
    await loadSettings();
  } catch (e) { fail(e, 'تعذر حفظ هوية المطعم'); }
}
async function upsertBrandRow(itemKey, label, value, existing) {
  if (existing) {
    const up = await sb.from('app_content').update({ label_ar: label, value, is_active: true }).eq('group_key', 'brand').eq('item_key', itemKey).select('id').single();
    if (up.error) throw up.error;
  } else {
    const ins = await sb.from('app_content').insert({ group_key: 'brand', item_key: itemKey, label_ar: label, value, sort_order: 0, is_active: true }).select('id').single();
    if (ins.error) throw ins.error;
  }
}
async function saveSettings(payload, btnId) {
  const btn = $(btnId);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ حفظ...'; }
  try {
    const { data, error } = await sb.functions.invoke('admin-api', { body: { action: 'update_store_settings', ...payload } });
    if (error) throw error;
    if (data?.error) throw new Error(data.error);
    if (!data?.data) throw new Error('لم يؤكد الخادم حفظ الإعدادات');
    toast('تم الحفظ في قاعدة البيانات، وسيظهر التحديث للعميل تلقائيًا', 'ok');
    await loadSettings();
  } catch (e) { fail(e, 'تعذر حفظ الإعدادات في قاعدة البيانات'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '💾 حفظ'; } }
}
async function saveLoyalty(payload, btnId) {
  const btn = $(btnId);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ حفظ...'; }
  try {
    const { error } = await sb.from('store_settings').update(payload).eq('id', CONFIG.SETTINGS_ROW_ID);
    if (error) throw error;
    toast('تم الحفظ', 'ok');
    await loadLoyalty();
  } catch (e) { fail(e); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '💾 حفظ'; } }
}

async function loadZones() {
  const body = $('zones-body');
  if (!body) return;
  const r = await safeQuery(() => sb.from('delivery_zones').select('*').order('name_ar'), null);
  if (!r.data) { body.innerHTML = notInstalledMsg('delivery_zones'); return; }
  body.innerHTML = `
    ${r.data.map(z => `<div style="display:grid;grid-template-columns:1fr 90px 90px 70px;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);opacity:${z.is_active?1:.6}">
      <b>${esc(z.name_ar)}${z.is_active?'':' (معطلة)'}</b>
      <small>${money(z.fee)}</small>
      <small>${money(z.min_order)}</small>
      <button class="btn out sm ${z.is_active?'dng':'ok'}" onclick="toggleZone('${z.id}',${!z.is_active})">${z.is_active?'تعطيل':'تفعيل'}</button>
    </div>`).join('') || '<div class="empty">لا مناطق</div>'}
    <button class="btn out sm" id="add-zone" style="margin-top:10px">+ منطقة</button>`;
  $('add-zone').onclick = () => {
    openModal(`<h2>منطقة جديدة <button class="close" onclick="closeModal()">✕</button></h2>
      <label>الاسم</label><input id="z_name">
      <label>الرسوم</label><input id="z_fee" type="number" min="0" value="0">
      <label>الحد الأدنى</label><input id="z_min" type="number" min="0" value="0">
      <div class="row"><button class="btn pri big" id="z_save">حفظ</button>
      <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
    $('z_save').onclick = async () => {
      if (!$('z_name').value.trim()) return shake($('mod'));
      try {
        const { error } = await sb.from('delivery_zones').insert({
          name_ar: $('z_name').value.trim(),
          fee: parseNumber($('z_fee').value) || 0,
          min_order: parseNumber($('z_min').value) || 0
        });
        if (error) throw error;
        closeModal(); toast('تم', 'ok'); loadZones();
      } catch (e) { fail(e); }
    };
  };
}
window.toggleZone = async (id, active) => {
  if (!await ask(active?'تفعيل':'تعطيل', active?'إعادة تفعيل منطقة التوصيل؟':'تعطيل منطقة التوصيل؟', 'تأكيد')) return;
  const { error } = await sb.from('delivery_zones').update({is_active:active}).eq('id', id);
  if (error) return fail(error);
  loadZones();
};
window.deleteZone = id => window.toggleZone(id, false);
</script>
<script>
/* ---- inlined from js/13-pagination-table.js ---- */
/* ═══════════════════════════════════════════════════

function paginate(arr, key) {
  const size = CONFIG.PAGE_SIZE;
  const idx = pageIdx[key] || 0;
  const total = Math.max(1, Math.ceil(arr.length / size));
  const current = Math.min(idx, total - 1);
  pageIdx[key] = current;
  return { items: arr.slice(current * size, (current + 1) * size), total, current };
}
function renderPager(p, key) {
  if (p.total <= 1) return '';
  return `<div class="pager">
    <button ${p.current === 0 ? 'disabled' : ''} data-page="${p.current - 1}">‹</button>
    <span>${p.current + 1} / ${p.total}</span>
    <button ${p.current >= p.total - 1 ? 'disabled' : ''} data-page="${p.current + 1}">›</button>
  </div>`;
}
</script>
<script>
/* ---- inlined from js/14-boot.js ---- */
/* ═══════════════════════════════════════════════════
   SECTION 14 · BOOT
   ═══════════════════════════════════════════════════ */
(async function boot() {
  if (!sb) {
    $('login').classList.remove('hidden');
    $('lerr').textContent = 'تعذر تحميل Supabase';
    return;
  }
  if (!configured) {
    $('login').classList.remove('hidden');
    $('lerr').textContent = 'أضف رابط Supabase';
    return;
  }
  try {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      const u = await sb.auth.getUser();
      if (u.data.user) { await enter(u.data.user); return; }
    }
    $('login').classList.remove('hidden');
  } catch (e) {
    console.error(e);
    $('login').classList.remove('hidden');
    $('lerr').textContent = 'تعذر الاتصال';
  }
})();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ME) {
    loadOrders().then(() => refreshIfSafe(page));
  }
});
</script>

/* ---- js/15-pwa: لا يوجد Service Worker في هذه النسخة (ملف واحد فقط) ----
   تنظيف: إذا كان الجهاز مسجّلًا Service Worker قديم من نسخة سابقة (sw.js)،
   نلغي تسجيله ونمسح كاشه، حتى لا يستمر في تقديم نسخة قديمة من الصفحة. */
(function cleanupOldServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => Promise.all(regs.map((r) => r.unregister())))
      .catch(() => {});
  }
  if ('caches' in window) {
    caches.keys()
      .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
      .catch(() => {});
  }
})();
