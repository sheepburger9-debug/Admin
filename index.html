        <textarea id="m_desc" rows="2" placeholder="مثال: لحم بقري طازج مع جبنة شيدر وصوص مخصوص">${esc(m?.description_ar || '')}</textarea>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">3. القسم</h3>
        <label>القسم اللي هيظهر فيه المنتج * <small>القسم هو اللي بيظهر كشاشة مستقلة في المنيو</small></label>
        <select id="m_cat_id">
          <option value="">— اختار القسم —</option>
          ${(cats.data || []).map(c => `<option value="${c.id}" ${m?.category_id === c.id ? 'selected' : ''}>${esc(c.name_ar)}</option>`).join('')}
        </select>
        <div id="m_subcat_wrap" class="hide">
          <label>تصنيف فرعي (اختياري) <small>لتقسيم القسم لمجموعات أصغر</small></label>
          <select id="m_subcat_id"></select>
        </div>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:4px">4. الأحجام والأسعار *</h3>
        <p style="font-size:12px;color:var(--ink2);line-height:1.7;margin:0 0 6px">لازم حجم واحد على الأقل باسم وسعر أكبر من صفر. لو المنتج له حجم واحد اكتب "عادي". سعر بعد الخصم اختياري، ولازم يكون أقل من السعر الأصلي.</p>
        <div id="sizes-list"></div>
        <button type="button" class="btn out sm" id="add-size" style="margin-top:8px">+ إضافة حجم</button>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">5. المكونات (اختياري)</h3>
        <textarea id="m_ingr" rows="2" placeholder="مثال: لحم بقري، جبنة شيدر، خس، طماطم">${esc(Array.isArray(m?.ingredients_ar) ? m.ingredients_ar.join(', ') : (m?.ingredients_ar || ''))}</textarea>
        <small style="color:var(--ink2);font-size:12px">افصل بين كل مكون والتاني بفاصلة.</small>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">6. الإضافات (اختياري)</h3>
        <div class="chips" id="addon-chips">
          ${(addons.data || []).map(a => `<label class="chip ${selAddon.has(a.id) ? 'on' : ''}" data-addon="${a.id}">${esc(a.name_ar)} +${money(a.price || 0)}</label>`).join('') || '<span style="color:var(--ink2);font-size:12px">مفيش إضافات لسه. اعملها من قسم الإضافات الأول.</span>'}
        </div>
        <small style="color:var(--ink2);font-size:12px">اضغط على الإضافة عشان تختارها أو تلغيها.</small>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">7. علامات المنيو (اختياري)</h3>
        <div class="toggle"><span>🔥 الأكثر طلبًا <small>يظهر في فلتر «الأكثر طلبًا»</small></span><input type="checkbox" id="m_popular" ${m?.is_popular ? 'checked' : ''}></div>
        <div class="toggle"><span>🌶️ حار <small>يظهر في فلتر «حار»</small></span><input type="checkbox" id="m_spicy" ${m?.is_spicy ? 'checked' : ''}></div>
        <div class="toggle"><span>🌱 نباتي <small>يظهر في فلتر «نباتي»</small></span><input type="checkbox" id="m_veg" ${m?.is_vegetarian ? 'checked' : ''}></div>
        <div class="toggle"><span>🛵 توصيل مجاني <small>يظهر في فلتر «توصيل مجاني»</small></span><input type="checkbox" id="m_free_delivery" ${m?.free_delivery ? 'checked' : ''}></div>
      </section>

      <section style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">8. الظهور</h3>
        <div class="toggle"><span>✅ متوفر للطلب <small>لو مطفي المنتج بيختفي من المنيو</small></span><input type="checkbox" id="m_avail" ${m?.is_available !== false ? 'checked' : ''}></div>
        <div class="toggle"><span>🤫 منيو سري <small>يظهر بس بكود المنيو السري، ومش في المنيو العادي</small></span><input type="checkbox" id="m_secret" ${m?.is_secret ? 'checked' : ''}></div>
      </section>

      <div class="row" style="margin-top:16px;position:sticky;bottom:-22px;background:var(--sf);padding:12px 0;border-top:1px solid var(--line)">
        <button class="btn pri big" id="m_save">💾 حفظ المنتج</button>
        <button class="btn out big" onclick="closeModal()">إلغاء</button>
      </div>
    `, true);

    // ---- صورة المنتج: رفع من الجهاز ----
    $('mod')._img = m?.image_url || '';
    const paintImg = () => {
      const box = $('m_img_prev'), u = $('mod')._img;
      box.innerHTML = u
        ? `<img src="${esc(u)}" alt="صورة المنتج" style="width:100%;height:100%;object-fit:cover">`
        : '<span style="font-size:40px">🍽️</span>';
    };
    paintImg();
    $('m_file').onchange = async e => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) return toast('نوع الصورة غير مدعوم. استخدم JPG أو PNG أو WEBP', 'err');
      if (f.size > 5 * 1024 * 1024) return toast('حجم الصورة أكبر من 5 ميجابايت', 'err');
      const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[f.type];
      const path = `items/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      $('m_img_status').textContent = '⏳ جاري رفع الصورة...';
      try {
        const up = await sb.storage.from('menu-images').upload(path, f, { contentType: f.type, upsert: false });
        if (up.error) throw up.error;
        const url = sb.storage.from('menu-images').getPublicUrl(path)?.data?.publicUrl;
        if (!url) throw new Error('تعذر الحصول على رابط الصورة');
        $('mod')._img = url;
        paintImg();
        $('m_img_status').textContent = '✅ تم رفع الصورة. اضغط حفظ المنتج عشان تتسجل.';
      } catch (err) { $('m_img_status').textContent = ''; fail(err, hpErrMsg(err)); }
    };
    $('m_img_remove').onclick = () => { $('mod')._img = ''; paintImg(); $('m_img_status').textContent = 'اتشالت الصورة. اضغط حفظ عشان التغيير يتسجل.'; };

    // ---- التصنيف الفرعي يظهر بس لو القسم ليه تصنيفات فرعية ----
    const fillSubcats = () => {
      const selectedCategory = $('m_cat_id').value;
      const options = (subcategories.data || []).filter(sc => sc.category_id === selectedCategory);
      $('m_subcat_id').innerHTML = '<option value="">— بدون —</option>' + options.map(sc => `<option value="${sc.id}" ${m?.subcategory_id === sc.id ? 'selected' : ''}>${esc(sc.name_ar)}</option>`).join('');
      $('m_subcat_wrap').classList.toggle('hide', options.length === 0);
    };
    fillSubcats();
    $('m_cat_id').onchange = fillSubcats;

    // Chips
    $('mod').querySelectorAll('[data-badge],[data-allerg],[data-addon]').forEach(c => {
      c.onclick = e => {
        e.preventDefault();
        c.classList.toggle('on');
      };
    });
    // Sizes
    const sizesList_el = $('sizes-list');
    const renderSizes = () => {
      sizesList_el.innerHTML = `
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 90px 110px 40px;gap:6px;font-size:12px;color:var(--ink2);font-weight:700;margin-top:4px">
          <span>اسم الحجم *</span><span>السعر *</span><span>بعد الخصم</span><span></span>
        </div>
      ` + $('mod')._sizes.map((s, i) => `
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 90px 110px 40px;gap:6px;margin-top:6px">
          <input data-size-name="${i}" placeholder="مثال: عادي أو كبير" value="${esc(s.name_ar || '')}" maxlength="40">
          <input data-size-price="${i}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="مثال: 100" value="${Number.isFinite(Number(s.price)) && Number(s.price) > 0 ? Number(s.price) : ''}">
          <input data-size-sale="${i}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="اختياري" value="${s.sale != null && Number(s.sale) > 0 ? Number(s.sale) : ''}">
          <button type="button" class="btn out sm dng" data-size-remove="${i}" aria-label="حذف الحجم">✕</button>
        </div>
      `).join('') || '<span style="color:var(--ink2);font-size:12px">لسه مفيش أحجام. اضغط «+ إضافة حجم».</span>';

      sizesList_el.querySelectorAll('[data-size-name]').forEach(input => {
        input.addEventListener('input', e => {
          const i = Number(e.currentTarget.dataset.sizeName);
          if ($('mod')._sizes[i]) $('mod')._sizes[i].name_ar = e.currentTarget.value;
        });
      });
      sizesList_el.querySelectorAll('[data-size-price]').forEach(input => {
        input.addEventListener('input', e => {
          const i = Number(e.currentTarget.dataset.sizePrice);
          if ($('mod')._sizes[i]) $('mod')._sizes[i].price = parseNumber(e.currentTarget.value);
        });
      });
      sizesList_el.querySelectorAll('[data-size-sale]').forEach(input => {
        input.addEventListener('input', e => {
          const i = Number(e.currentTarget.dataset.sizeSale);
          if ($('mod')._sizes[i]) $('mod')._sizes[i].sale = e.currentTarget.value === '' ? null : parseNumber(e.currentTarget.value);
        });
      });
      sizesList_el.querySelectorAll('[data-size-remove]').forEach(button => {
        button.addEventListener('click', e => {
          const i = Number(e.currentTarget.dataset.sizeRemove);
          $('mod')._sizes.splice(i, 1);
          renderSizes();
        });
      });
    };
    $('mod')._sizes = sizesList.map(s => ({...s}));
    $('mod')._renderSizes = renderSizes;
    renderSizes();
    $('add-size').onclick = () => { $('mod')._sizes.push({ name_ar:'', price:0, sale:null }); renderSizes(); };

    $('m_save').onclick = async () => {
      const errs = [];
      const markBad = id => { const el = $(id); if (el) el.style.borderColor = 'var(--err)'; };
      ['m_ar', 'm_cat_id'].forEach(id => { const el = $(id); if (el) el.style.borderColor = ''; });

      const ar = $('m_ar').value.trim();
      if (!ar) { errs.push('اسم المنتج'); markBad('m_ar'); }
      if (!$('m_cat_id').value) { errs.push('القسم'); markBad('m_cat_id'); }

      const sizesRaw = $('mod')._sizes || [];
      const validSizes = sizesRaw.filter(x => (x.name_ar || '').trim() && Number(x.price) > 0)
        .map(x => ({ name_ar: x.name_ar.trim(), price: Number(x.price) }));
      if (!validSizes.length) errs.push('حجم واحد على الأقل باسم وسعر أكبر من صفر');

      const saleByLabel = new Map();
      for (const x of sizesRaw) {
        if (!(x.name_ar || '').trim() || Number(x.price) <= 0) continue;
        const sale = x.sale == null || x.sale === '' ? null : Number(x.sale);
        if (sale === null) { saleByLabel.set(x.name_ar.trim(), null); continue; }
        if (!Number.isFinite(sale) || sale <= 0 || sale >= Number(x.price)) {
          errs.push(`سعر بعد الخصم للحجم «${x.name_ar}» لازم يكون أكبر من صفر وأقل من سعره الأصلي`);
          continue;
        }
        saleByLabel.set(x.name_ar.trim(), sale);
      }

      const box = $('m_errors');
      if (errs.length) {
        box.innerHTML = '⚠️ لسه ناقص: ' + errs.join(' · ');
        box.classList.remove('hide');
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      box.classList.add('hide');

      const subId = $('m_subcat_id')?.value || '';
      const payload = {
        name_ar: ar,
        description_ar: $('m_desc').value.trim() || null,
        category_id: $('m_cat_id').value,
        subcategory_id: subId || null,
        subcategory_ar: subId ? ((subcategories.data || []).find(sc => sc.id === subId)?.name_ar || null) : null,
        image_url: $('mod')._img || null,
        is_available: $('m_avail').checked,
        ingredients_ar: $('m_ingr').value.split(',').map(x => x.trim()).filter(Boolean),
        is_spicy: $('m_spicy').checked,
        is_vegetarian: $('m_veg').checked,
        is_popular: $('m_popular').checked,
        free_delivery: $('m_free_delivery').checked,
        is_secret: $('m_secret').checked
      };
      // الرمز الداخلي يتولّد تلقائيًا عند الإضافة، ولا يُعرض للمستخدم
      if (!isEdit) payload.slug = `item-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

      try {
        let itemId = m?.id;
        if (isEdit) {
          const { error } = await sb.from('menu_items').update(payload).eq('id', itemId);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from('menu_items').insert(payload).select('id').single();
          if (error) throw error;
          itemId = data.id;
        }
        const pick = k => [...$('mod').querySelectorAll(`[data-${k}].on`)].map(c => c.dataset[k]);
        const rel = await sb.rpc('set_menu_item_relations', {
          p_item: itemId, p_allergens: null, p_addons: pick('addon'), p_badges: null, p_sizes: validSizes
        });
        if (rel.error) throw rel.error;
        // الدالة الجاهزة لا تحفظ سعر البيع، فنحدّثه مباشرة على كل حجم
        const savedSizes = await sb.from('item_sizes').select('id,label_ar,sale_price').eq('item_id', itemId);
        if (savedSizes.error) throw savedSizes.error;
        for (const z of (savedSizes.data || [])) {
          const want = saleByLabel.has(z.label_ar) ? saleByLabel.get(z.label_ar) : null;
          const current = z.sale_price == null ? null : Number(z.sale_price);
          if (want === current) continue;
          const up = await sb.from('item_sizes').update({ sale_price: want }).eq('id', z.id).select('id').single();
          if (up.error) throw up.error;
        }
        closeModal(); toast('تم الحفظ', 'ok'); go('menu');
      } catch (e) { const msg=String(e?.message||e||''); if (/SECRET_ITEM_PROMOTION_CONFLICT|PROMOTION_SECRET_ITEM_CONFLICT|SECRET_CODE_ITEM_NOT_ELIGIBLE|23514/i.test(msg)) { toast('لا يمكن تخصيص المنتج للكود السري لأنه مرتبط بعرض نشط. أوقف العرض أولًا أو اختر منتجًا آخر.', 'err'); } else { shake($('mod')); fail(e); } }
    };
  }).catch(err => {
    console.error('openMenuForm failed', err);
    openModal(`<h2>تعذر فتح نموذج الصنف</h2><p style="margin:12px 0">${esc(err?.message || 'حصل خطأ أثناء تحميل بيانات النموذج')}</p><div class="row"><button type="button" class="btn out big" onclick="closeModal()">إغلاق</button><button type="button" class="btn pri big" id="retry-menu-form">إعادة المحاولة</button></div>`, true);
    $('retry-menu-form').onclick = () => openMenuForm(m);
  });
}

/* ─── CATEGORIES ─── */
async function renderCategoriesPanel(v) {
  const r = await safeQuery(() => sb.from('categories').select('*').order('sort_order').order('name_ar'), null);
  if (!r.data) { v.innerHTML = notInstalledMsg('categories'); return; }
  const data = r.data;
  const edit = can(OM);

  v.innerHTML = `
    <div class="tabs" role="tablist" aria-label="قائمة الطعام">
      <button type="button" data-food-tab="products" role="tab" aria-selected="false">🍔 المنتجات</button>
      <button class="on" type="button" data-food-tab="categories" role="tab" aria-selected="true">📂 التصنيفات</button>
      <button type="button" data-food-tab="subcategories" role="tab" aria-selected="false">📁 تصنيفات فرعية</button>
      <button type="button" data-food-tab="addons" role="tab" aria-selected="false">➕ الإضافات</button>
    </div>
    <div class="head"><span>${data.length} تصنيف</span>${edit ? '<button class="btn pri" id="addc">+ تصنيف</button>' : ''}</div>
    <table class="tbl"><thead><tr><th>الاسم</th><th>Slug</th><th>الترتيب</th><th>الحالة</th>${edit ? '<th></th>' : ''}</tr></thead>
    <tbody>${data.map(c => `<tr data-id="${c.id}">
      <td data-label="الاسم"><b>${esc(c.name_ar)}</b>${c.name_en ? `<br><small style="color:var(--ink2)">${esc(c.name_en)}</small>` : ''}</td>
      <td data-label="Slug" dir="ltr">${esc(c.slug || '—')}</td>
      <td data-label="الترتيب">${c.sort_order || 0}</td>
      <td data-label="الحالة">${c.is_active !== false ? '✅' : '⛔'}</td>
      ${edit ? `<td data-label=""><div class="row"><button class="btn out sm" data-a="ed">✏️</button><button class="btn out dng sm" data-a="del">🗑️</button></div></td>` : ''}
    </tr>`).join('') || '<tr><td colspan="5" class="empty">لا تصنيفات</td></tr>'}</tbody></table>`;

  v.querySelectorAll('[data-food-tab="products"]').forEach(b => b.onclick = () => VIEWS.menu(v));
  v.querySelectorAll('[data-food-tab="addons"]').forEach(b => b.onclick = () => VIEWS.addons(v));
  v.querySelectorAll('[data-food-tab="subcategories"]').forEach(b => b.onclick = () => renderSubcategoriesPanel(v));
  if (edit) {
    $('addc').onclick = () => openCategoryForm(null);
    v.querySelectorAll('[data-a="ed"]').forEach(b => b.onclick = () => {
      const id = b.closest('tr').dataset.id;
      openCategoryForm(data.find(c => c.id === id));
    });
    v.querySelectorAll('[data-a="del"]').forEach(b => b.onclick = () => {
      dcCurrent = 'categories';
      go('delete-center');
    });
  }
}

async function renderSubcategoriesPanel(v) {
  const [catsR, subR] = await Promise.all([
    safeQuery(()=>sb.from('categories').select('id,name_ar,is_active').order('sort_order'), []),
    safeQuery(()=>sb.from('subcategories').select('id,category_id,slug,name_ar,sort_order,is_active').order('sort_order').order('name_ar'), null)
  ]);
  if (!subR.data) { v.innerHTML = `<div class="empty">تعذر تحميل التصنيفات الفرعية. تأكد من تطبيق تحديث قاعدة البيانات.</div>`; return; }
  const cats=catsR.data||[], data=subR.data||[], canEdit=can(OM), cm=new Map(cats.map(x=>[x.id,x.name_ar]));
  v.innerHTML=`<div class="tabs" role="tablist" aria-label="قائمة الطعام"><button type="button" data-food-tab="products">🍔 المنتجات</button><button type="button" data-food-tab="categories">📂 التصنيفات</button><button class="on" type="button" data-food-tab="subcategories">📁 تصنيفات فرعية</button><button type="button" data-food-tab="addons">➕ الإضافات</button></div><div class="set-card" style="margin-bottom:12px"><h3>📁 تصنيف داخل تصنيف</h3><p style="font-size:13px;line-height:1.9;color:var(--ink2)">أنشئ قسمًا رئيسيًا أولًا من «التصنيفات»، ثم أضف تحته تصنيفًا فرعيًا. عند تعديل المنتج اختر القسم الرئيسي ثم التصنيف الفرعي من القوائم؛ تغيير القسم يعرض فقط التصنيفات الفرعية التابعة له.</p></div><div class="head"><span>${data.length} تصنيف فرعي</span>${canEdit?'<button class="btn pri" id="add-subcategory">+ تصنيف فرعي</button>':''}</div>${data.length?`<table class="tbl"><thead><tr><th>الاسم</th><th>القسم الرئيسي</th><th>الترتيب</th><th>الحالة</th>${canEdit?'<th>إجراء</th>':''}</tr></thead><tbody>${data.map(x=>`<tr data-subcategory-id="${x.id}"><td data-label="الاسم"><b>${esc(x.name_ar)}</b></td><td data-label="القسم الرئيسي">${esc(cm.get(x.category_id)||'قسم غير موجود')}</td><td>${x.sort_order||0}</td><td>${x.is_active?'نشط':'متوقف'}</td>${canEdit?`<td><div class="row"><button class="btn out sm" data-sub-edit>تعديل</button><button class="btn out sm" data-sub-toggle>${x.is_active?'إيقاف':'تفعيل'}</button></div></td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">لم تضف تصنيفات فرعية بعد.</div>'}`;
  v.querySelectorAll('[data-food-tab="products"]').forEach(b=>b.onclick=()=>VIEWS.menu(v));

VIEWS.coupons = async v => {
  const r = await safeQuery(() => sb.from('coupons').select('*').order('created_at', { ascending: false }).limit(300), []);

          <td data-label="الاستخدام">${c.used_count || 0}${c.max_uses ? ' / ' + c.max_uses : ''}</td>
          <td data-label="الحالة">${status}</td>
          <td data-label=""><div class="row">
            <button class="btn out sm" data-a="ed">✏️</button>
            <button class="btn out ${c.is_active ? 'dng' : 'ok'} sm" data-a="tg">${c.is_active ? '⏸' : '▶️'}</button>
          </div></td>
        </tr>`; }).join('')}</tbody></table>${renderPager(p, 'coupons')}`
      : '<div class="empty">مفيش كوبونات</div>'}`;

function openCouponForm(c) {
  const isEdit = !!c;
  openModal(`
    <h2>${isEdit ? 'تعديل' : 'جديد'} كوبون <button class="close" onclick="closeModal()">✕</button></h2>
    <label>الكود *</label><input id="co_code" dir="ltr" style="text-transform:uppercase" value="${esc(c?.code || '')}">
    <label>نوع الخصم</label>
    <select id="co_type">
      <option value="percent" ${c?.type === 'percent' ? 'selected' : ''}>نسبة %</option>
      <option value="fixed" ${c?.type === 'fixed' ? 'selected' : ''}>مبلغ ثابت</option>
    </select>
    <label>القيمة *</label><input id="co_val" type="number" min="0" step="0.5" value="${c?.value ?? ''}">
    <label>الحد الأدنى لقيمة الطلب بالجنيه <small>لن ينطبق العرض على طلب أقل من هذا المبلغ</small></label><input id="co_min" type="number" min="0" value="${c?.min_order ?? 0}">
    <label>أقصى خصم (اختياري)</label><input id="co_maxdiscount" type="number" min="0" value="${c?.max_discount ?? ''}">
    <label>حد الاستخدام الكلي</label><input id="co_limit" type="number" min="1" placeholder="بدون" value="${c?.max_uses ?? ''}">
    <label>حد الاستخدام لكل مستخدم</label><input id="co_peruser" type="number" min="1" placeholder="بدون" value="${c?.per_user_limit ?? ''}">
    <label>تاريخ البداية</label><input id="co_start" type="date" value="${c?.starts_at ? c.starts_at.slice(0,10) : ''}">
    <label>تاريخ الانتهاء</label><input id="co_exp" type="date" value="${c?.ends_at ? c.ends_at.slice(0,10) : ''}">
    <div class="row"><button class="btn pri big" id="co_save">حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>
  `);
  $('co_save').onclick = async () => {
    const code = $('co_code').value.trim().toUpperCase();
    const value = parseNumber($('co_val').value);
    if (!code || !(value > 0)) return shake($('mod'));
    if ($('co_type').value === 'percent' && value > 100) { toast('النسبة لا تزيد عن 100%', 'err'); return; }
    const payload = {
      code, value,
      type: $('co_type').value,
      min_order: parseNumber($('co_min').value) || 0,
      max_discount: parseNumber($('co_maxdiscount').value)>0 ? parseNumber($('co_maxdiscount').value) : null,
      is_active: c?.is_active !== false,
    };
    const limit = parseNumber($('co_limit').value);
    payload.max_uses = limit > 0 ? limit : null;
    const perU = parseNumber($('co_peruser').value);
    payload.per_user_limit = perU > 0 ? perU : null;
    payload.starts_at = $('co_start').value ? new Date($('co_start').value + 'T00:00:00').toISOString() : null;
    payload.ends_at = $('co_exp').value ? new Date($('co_exp').value + 'T23:59:59').toISOString() : null;
    if (payload.ends_at && payload.starts_at && payload.ends_at < payload.starts_at) { toast('تاريخ الانتهاء قبل البداية', 'err'); return; }
    try {
      const { error } = isEdit
        ? await sb.from('coupons').update(payload).eq('id', c.id)
        : await sb.from('coupons').insert(payload);
      if (error) throw error;
      closeModal(); toast('تم', 'ok'); go('coupons');
    } catch (e) { fail(e); }
  };
}

    <label>تاريخ انتهاء العرض <small>بعده يختفي العرض تلقائيًا</small></label><input id="of_end" type="date" value="${x?.ends_at?x.ends_at.slice(0,10):''}">
    <label>الحد الأدنى لقيمة الطلب بالجنيه <small>لن ينطبق العرض على طلب أقل من هذا المبلغ</small></label><input id="of_min" type="number" min="0" value="${x?.min_order??0}">
    <label>المنتج المستهدف <small>اختياري؛ اتركه على «كل المنتجات» لو العرض عام</small></label><select id="of_target">${itemOptions(x?.target_item_id, 'كل المنتجات')}</select>
    <label>المنتج المجاني <small>مطلوب فقط عند اختيار نوع «صنف مجاني»</small></label><select id="of_reward_item">${itemOptions(x?.reward_item_id, 'اختر المنتج المجاني')}</select>
    <label>الإضافة المجانية <small>مطلوبة فقط عند اختيار نوع «إضافة مجانية»</small></label><select id="of_reward_addon">${addonOptions(x?.reward_addon_id, 'اختر الإضافة المجانية')}</select>
    <label>أولوية العرض <small>الأعلى يظهر أولًا في السلايدر</small></label><input id="of_priority" type="number" value="${x?.priority??0}">
    <label title="عند إيقاف العرض لن يظهر للعميل حتى لو كانت تواريخه سارية"><input id="of_active" type="checkbox" ${x?.is_active?'checked':''}> العرض نشط</label>
    <div class="row"><button class="btn pri big" id="of_save">حفظ العرض</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
  if(x) $('of_type').value=x.promotion_type;
  $('of_save').onclick=async()=>{const name_ar=$('of_name').value.trim(),value=parseNumber($('of_value').value),min_order=parseNumber($('of_min').value)||0,imageUrl=$('of_image').value.trim();if(!name_ar||value<0)return toast('أدخل اسمًا وقيمة صحيحة','err');if(imageUrl&&!/^https:\/\//i.test(imageUrl))return toast('رابط صورة البانر يجب أن يبدأ بـ https://','err');const promotion_type=$('of_type').value; if((promotion_type==='percent' && !(value>0 && value<=100)) || (promotion_type==='fixed' && !(value>0)) || (['free_delivery','free_item','free_addon'].includes(promotion_type) && value!==0)) return toast('راجع قيمة العرض حسب نوعه','err'); if(promotion_type==='free_item'&&!$('of_reward_item').value)return toast('حدد المنتج المجاني من إعدادات العرض','err'); if(promotion_type==='free_addon'&&!$('of_reward_addon').value)return toast('حدد الإضافة المجانية من إعدادات العرض','err'); const maxUsesInput=parseNumber($('of_max_uses').value); if(maxUsesInput>0&&x&&maxUsesInput<x.used_count)return toast('حد الاستخدام أقل من مرات الاستخدام الحالية','err'); const payload={name_ar,description_ar:$('of_desc').value.trim()||null,image_url:$('of_image').value.trim()||null,promotion_type,value,min_order,priority:parseInt($('of_priority').value,10)||0,is_active:$('of_active').checked,max_discount:parseNumber($('of_max_discount').value)>0?parseNumber($('of_max_discount').value):null,target_item_id:$('of_target').value||null,reward_item_id:promotion_type==='free_item'?($('of_reward_item').value||null):null,reward_addon_id:promotion_type==='free_addon'?($('of_reward_addon').value||null):null,max_uses:parseNumber($('of_max_uses').value)>0?parseNumber($('of_max_uses').value):null,starts_at:$('of_start').value?new Date($('of_start').value+'T00:00:00').toISOString():null,ends_at:$('of_end').value?new Date($('of_end').value+'T23:59:59').toISOString():null,updated_at:new Date().toISOString()}; if(payload.starts_at&&payload.ends_at&&payload.ends_at<payload.starts_at)return toast('تاريخ الانتهاء قبل البداية','err'); const q=x?await sb.from('menu_promotions').update(payload).eq('id',x.id):await sb.from('menu_promotions').insert(payload);if(q.error)return fail(q.error);closeModal();toast('تم حفظ العرض','ok');go('offers');};
}

/* ═══════════════════════════════════════════════════
   SECTION 7b · ربط العروض والحملات
   - ربط المنتجات بالعرض (menu_promotion_items، مفتاح مركّب يمنع التكرار)
   - نطاق العرض وتصنيفه (menu_promotions.promotion_scope / target_category_id)
   - صفحة الحملة (menu_promotions.promotion_page_id)
   - أماكن الظهور (promotion_display_placements)
   - الشارات (promotion_badges ← display_badges)
   - إدارة صفحات الحملات (promotion_pages)
   كل قراءة من Supabase، وكل كتابة يتحقق منها الصف المُرجَع ثم تُعاد القراءة.
   ═══════════════════════════════════════════════════ */
const PROMO_SCOPES = { all: 'كل المنتجات', items: 'منتجات محددة', category: 'تصنيف' };
const PROMO_PLACEMENTS = { checkout: 'صفحة الدفع', menu: 'المنيو', homepage_block: 'بلوك في الصفحة الرئيسية', cart: 'السلة' };

/* يحمّل كل بيانات ربط العرض ثم يرسم النافذة */
async function laOpen(offerId) {
  const [promoR, linkR, catR, itemR, plR, pageR, blkR, badgeR, linkedBadgeR] = await Promise.all([
    sb.from('menu_promotions').select('id,name_ar,promotion_scope,target_category_id,promotion_page_id').eq('id', offerId).maybeSingle(),
    sb.from('menu_promotion_items').select('item_id').eq('promotion_id', offerId),
    sb.from('categories').select('id,name_ar').order('name_ar'),
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('promotion_display_placements').select('*').eq('promotion_id', offerId).order('sort_order'),
    sb.from('promotion_pages').select('id,title_ar').order('sort_order'),
    sb.from('homepage_blocks').select('id,title_ar').order('sort_order'),
    sb.from('display_badges').select('*').order('priority', { ascending: false }),
    sb.from('promotion_badges').select('badge_id,sort_order').eq('promotion_id', offerId).order('sort_order')
  ]);
  for (const x of [promoR, linkR, catR, itemR, plR, pageR, blkR, badgeR, linkedBadgeR]) if (x.error) throw x.error;
  const promo = promoR.data;
  if (!promo) throw new Error('العرض غير موجود أو ليست لديك صلاحية لرؤيته');

  const linkedIds = new Set((linkR.data || []).map(x => x.item_id));
  const itemName = id => (itemR.data || []).find(x => x.id === id)?.name_ar || '(منتج محذوف)';
  const catName = id => (catR.data || []).find(x => x.id === id)?.name_ar || '—';
  const placements = hpByOrder(plR.data || []);
  const blockName = id => (blkR.data || []).find(x => x.id === id)?.title_ar || '(بلوك غير موجود)';
  const badges = badgeR.data || [];
  const linkedBadgeIds = new Set((linkedBadgeR.data || []).map(x => x.badge_id));
  const linkedBadgesOrdered = (linkedBadgeR.data || []).map(x => badges.find(b => b.id === x.badge_id)).filter(Boolean);

  openModal(`<h2>🔗 ربط العرض: ${esc(promo.name_ar)} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>

    <div class="set-card" style="margin-bottom:12px">
      <h3>🛒 المنتجات المرتبطة (${linkedIds.size})</h3>
      ${linkedIds.size === 0 ? '<div class="empty" style="padding:8px">لا توجد منتجات مرتبطة</div>' :
        [...linkedIds].map(id => `<div class="row" style="align-items:center;gap:6px;padding:4px 0"><span style="flex:1">${esc(itemName(id))}</span>
          <button class="btn out sm dng" data-la="rm-item" data-id="${id}">إزالة</button></div>`).join('')}
      <div class="row" style="margin-top:8px;gap:6px">
        <select id="la_item" style="flex:1">
          <option value="">— اختر منتجًا لإضافته —</option>
          ${(itemR.data || []).filter(x => !linkedIds.has(x.id)).map(x => `<option value="${x.id}">${esc(x.name_ar)}</option>`).join('')}
        </select>
        <button class="btn pri sm" data-la="add-item">+ إضافة</button>
      </div>
    </div>

    <div class="set-card" style="margin-bottom:12px">
      <h3>🎯 نطاق العرض والتصنيف</h3>
      <label>نطاق العرض</label>
      <select id="la_scope">${Object.entries(PROMO_SCOPES).map(([k, l]) => `<option value="${k}" ${promo.promotion_scope === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label>التصنيف (عند اختيار «تصنيف»)</label>
      <select id="la_cat"><option value="">— بدون —</option>${(catR.data || []).map(c => `<option value="${c.id}" ${promo.target_category_id === c.id ? 'selected' : ''}>${esc(c.name_ar)}</option>`).join('')}</select>
      <button class="btn pri sm" style="margin-top:10px" data-la="save-scope">💾 حفظ النطاق</button>
      <small style="display:block;margin-top:6px;color:var(--ink2)">الحالي: ${esc(PROMO_SCOPES[promo.promotion_scope] || promo.promotion_scope || '—')}${promo.target_category_id ? ' · ' + esc(catName(promo.target_category_id)) : ''}</small>
    </div>

    <div class="set-card" style="margin-bottom:12px">
      <h3>📄 صفحة الحملة</h3>
      <select id="la_page"><option value="">— بدون صفحة —</option>${(pageR.data || []).map(p => `<option value="${p.id}" ${promo.promotion_page_id === p.id ? 'selected' : ''}>${esc(p.title_ar)}</option>`).join('')}</select>
      <button class="btn pri sm" style="margin-top:10px" data-la="save-page">💾 حفظ الصفحة</button>
    </div>

    <div class="set-card" style="margin-bottom:12px">
      <h3>📍 أماكن الظهور</h3>
      ${placements.length === 0 ? '<div class="empty" style="padding:8px">لم يُحدَّد مكان ظهور بعد</div>' :
        placements.map((p, idx) => `<div class="row" style="align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)">
          <div style="flex:1"><b>${esc(PROMO_PLACEMENTS[p.placement_type] || p.placement_type)}</b>
            ${p.block_id ? `<small style="color:var(--ink2)"> · ${esc(blockName(p.block_id))}</small>` : ''}
            ${hpBadge(p.is_active ? hpStatus({ is_active: true, starts_at: p.starts_at, ends_at: p.ends_at }) : { l: 'موقوف', c: 'var(--ink2)' })}</div>
          <button class="btn out sm" data-la="pl-up" data-id="${p.id}" ${idx === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
          <button class="btn out sm" data-la="pl-down" data-id="${p.id}" ${idx === placements.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>
          <button class="btn out sm ${p.is_active ? 'wr' : 'ok'}" data-la="pl-toggle" data-id="${p.id}">${p.is_active ? 'إيقاف' : 'تفعيل'}</button>
          <button class="btn out sm dng" data-la="pl-del" data-id="${p.id}">حذف</button>
        </div>`).join('')}
      <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">
        <select id="la_pl_type" style="flex:1;min-width:140px">${Object.entries(PROMO_PLACEMENTS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
        <select id="la_pl_blk" style="flex:1;min-width:140px"><option value="">— اختر البلوك —</option>${(blkR.data || []).map(b => `<option value="${b.id}">${esc(b.title_ar || '(بدون عنوان)')}</option>`).join('')}</select>
        <button class="btn pri sm" data-la="pl-add">+ إضافة موضع</button>
      </div>
    </div>

    <div class="set-card" style="margin-bottom:6px">
      <h3>🏷️ الشارات</h3>
      ${linkedBadgesOrdered.length === 0 ? '<div class="empty" style="padding:8px">لا توجد شارات مرتبطة</div>' :
        linkedBadgesOrdered.map(b => `<div class="row" style="align-items:center;gap:6px;padding:4px 0">
          <span style="flex:1"><span style="display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;color:${esc(b.text_color)};background:${esc(b.background_color)}">${esc(b.label_ar)}</span>
          <small style="color:var(--ink2)"> · ${esc(b.name)}${b.is_active ? '' : ' (موقوفة)'}</small></span>
          <button class="btn out sm dng" data-la="bd-rm" data-id="${b.id}">إزالة</button></div>`).join('')}
      <div class="row" style="margin-top:8px;gap:6px">
        <select id="la_badge" style="flex:1"><option value="">— اختر شارة —</option>
          ${badges.filter(b => !linkedBadgeIds.has(b.id)).map(b => `<option value="${b.id}">${esc(b.label_ar)} (${esc(b.name)})${b.is_active ? '' : ' — موقوفة'}</option>`).join('')}
        </select>
        <button class="btn pri sm" data-la="bd-add">+ ربط شارة</button>
      </div>
    </div>`);

  const reload = () => laOpen(offerId);
  $('mod').onclick = async e => {
    const b = e.target.closest('[data-la]');
    if (!b) return;
    const act = b.dataset.la, id = b.dataset.id;
    b.disabled = true;
    try {
      if (act === 'add-item') {
        const item = $('la_item').value;
        if (!item) throw new Error('اختر منتجًا أولًا');
        const r = await sb.from('menu_promotion_items').insert({ promotion_id: offerId, item_id: item }).select('item_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ الربط');
        toast('تم ربط المنتج', 'ok');
      } else if (act === 'rm-item') {
        const r = await sb.from('menu_promotion_items').delete().eq('promotion_id', offerId).eq('item_id', id).select('item_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم تتم الإزالة: الربط غير موجود أو ليست لديك صلاحية');
        toast('تمت إزالة المنتج', 'ok');
      } else if (act === 'save-scope') {
        const scope = $('la_scope').value;
        const cat = $('la_cat').value || null;
        if (scope === 'items' && linkedIds.size === 0) throw new Error('اربط منتجًا واحدًا على الأقل قبل اختيار «منتجات محددة»');
        if (scope === 'category' && !cat) throw new Error('اختر التصنيف المرتبط بالعرض');
        await hpUpdate('menu_promotions', offerId, { promotion_scope: scope, target_category_id: scope === 'category' ? cat : null });
        toast('تم حفظ النطاق في قاعدة البيانات', 'ok');
      } else if (act === 'save-page') {
        await hpUpdate('menu_promotions', offerId, { promotion_page_id: $('la_page').value || null });
        toast('تم حفظ صفحة الحملة', 'ok');
      } else if (act === 'pl-add') {
        const type = $('la_pl_type').value;
        const blk = type === 'homepage_block' ? ($('la_pl_blk').value || null) : null;
        if (type === 'homepage_block' && !blk) throw new Error('اختر البلوك الذي سيظهر فيه العرض');
        if (placements.some(p => p.placement_type === type && (p.block_id || null) === blk)) throw new Error('هذا الموضع مضاف بالفعل لهذا العرض');
        const maxO = placements.reduce((m, p) => Math.max(m, p.sort_order || 0), 0);
        const r = await sb.from('promotion_display_placements').insert({ promotion_id: offerId, placement_type: type, block_id: blk, sort_order: maxO + 10, is_active: true }).select('id').single();
        if (r.error) throw r.error;
        if (!r.data?.id) throw new Error('لم يؤكد الخادم إضافة الموضع');
        toast('تمت إضافة الموضع', 'ok');
      } else if (act === 'pl-up' || act === 'pl-down') {
        await hpMove('promotion_display_placements', placements, id, act === 'pl-up' ? -1 : 1);
        toast('تم تحديث الترتيب', 'ok');
      } else if (act === 'pl-toggle') {
        const p = placements.find(x => x.id === id);
        await hpUpdate('promotion_display_placements', id, { is_active: !p.is_active });
        toast('تم التحديث', 'ok');
      } else if (act === 'pl-del') {
        if (!await ask('حذف الموضع', 'سيتم حذف هذا الموضع من العرض. هل أنت متأكد؟', 'حذف')) { b.disabled = false; return; }
        const r = await sb.from('promotion_display_placements').delete().eq('id', id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
        toast('تم حذف الموضع', 'ok');
      } else if (act === 'bd-add') {
        const bid = $('la_badge').value;
        if (!bid) throw new Error('اختر شارة أولًا');
        const maxO = (linkedBadgeR.data || []).reduce((m, x) => Math.max(m, x.sort_order || 0), 0);
        const r = await sb.from('promotion_badges').insert({ promotion_id: offerId, badge_id: bid, sort_order: maxO + 10 }).select('badge_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ ربط الشارة');
        toast('تم ربط الشارة', 'ok');
      } else if (act === 'bd-rm') {
        const r = await sb.from('promotion_badges').delete().eq('promotion_id', offerId).eq('badge_id', id).select('badge_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم تتم الإزالة: الربط غير موجود أو ليست لديك صلاحية');
        toast('تمت إزالة الشارة', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    await reload();
  };
}

/* صفحات الحملات: إنشاء وتعديل وتفعيل وإيقاف (بدون حذف لأنها مرتبطة بالعروض) */
async function laOpenPages() {
  const r = await sb.from('promotion_pages').select('*').order('sort_order');
  if (r.error) return fail(r.error, hpErrMsg(r.error));
  const rows = hpByOrder(r.data || []);
  openModal(`<h2>📄 صفحات الحملات <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    ${rows.length === 0 ? '<div class="empty">لا توجد صفحات حملات بعد</div>' : rows.map(p => `<div class="row" style="align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1"><b>${esc(p.title_ar)}</b> <small dir="ltr" style="color:var(--ink2)">/${esc(p.slug)}</small> ${hpBadge(hpStatus(p))}</div>
      <button class="btn out sm" data-pg="edit" data-id="${p.id}">✏️</button>
      <button class="btn out sm ${p.is_active ? 'wr' : 'ok'}" data-pg="toggle" data-id="${p.id}">${p.is_active ? 'إيقاف' : 'تفعيل'}</button>
    </div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn pri big" data-pg="new">+ صفحة حملة جديدة</button></div>`);

  $('mod').onclick = async e => {
    const b = e.target.closest('[data-pg]');
    if (!b) return;
    const act = b.dataset.pg;
    if (act === 'new') return laPageEditor(null);
    const row = rows.find(x => x.id === b.dataset.id);
    if (act === 'edit') return laPageEditor(row);
    if (act === 'toggle') {
      b.disabled = true;
      try { await hpUpdate('promotion_pages', row.id, { is_active: !row.is_active }); toast('تم التحديث', 'ok'); }
      catch (err) { fail(err, hpErrMsg(err)); }
      laOpenPages();
    }
  };
}

function laPageEditor(p) {
  const isNew = !p;
  const r = p || { slug: '', title_ar: '', subtitle_ar: '', description_ar: '', card_image_url: '', cover_image_url: '', sort_order: 0, is_active: true, starts_at: null, ends_at: null };
  openModal(`<h2>${isNew ? 'صفحة حملة جديدة' : 'تعديل صفحة الحملة'} <button class="close" onclick="laOpenPages()" aria-label="رجوع">✕</button></h2>
    <label>الرابط المختصر (slug) * <small>حروف إنجليزية صغيرة وأرقام وشرطة فقط</small></label><input id="lp_slug" dir="ltr" maxlength="60" value="${esc(r.slug)}">
    <label>العنوان *</label><input id="lp_title" maxlength="120" value="${esc(r.title_ar)}">
    <label>العنوان الفرعي</label><input id="lp_sub" maxlength="160" value="${esc(r.subtitle_ar || '')}">
    <label>الوصف</label><textarea id="lp_desc" maxlength="600">${esc(r.description_ar || '')}</textarea>
    <label>صورة البطاقة (https)</label><input id="lp_card" dir="ltr" value="${esc(r.card_image_url || '')}">
    <label>صورة الغلاف (https)</label><input id="lp_cover" dir="ltr" value="${esc(r.cover_image_url || '')}">
    <label>ترتيب الظهور</label><input id="lp_order" type="number" value="${r.sort_order}">
    <label>بداية الظهور (اختياري)</label><input id="lp_start" type="datetime-local" value="${hpToLocal(r.starts_at)}">
    <label>نهاية الظهور (اختياري)</label><input id="lp_end" type="datetime-local" value="${hpToLocal(r.ends_at)}">
    <label class="toggle" style="margin-top:12px"><span>مفعّلة</span><input type="checkbox" id="lp_active" ${r.is_active ? 'checked' : ''}></label>
    <div class="row" style="margin-top:14px"><button class="btn pri big" id="lp_save">💾 حفظ</button>
    <button class="btn out big" onclick="laOpenPages()">رجوع</button></div>`);

  $('lp_save').onclick = async () => {
    const btn = $('lp_save');
    const slug = $('lp_slug').value.trim().toLowerCase();
    const title = $('lp_title').value.trim();
    const card = $('lp_card').value.trim(), cover = $('lp_cover').value.trim();
    const start = hpFromLocal($('lp_start').value), end = hpFromLocal($('lp_end').value);
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return toast('الرابط المختصر يجب أن يكون بحروف إنجليزية صغيرة وأرقام وشرطة فقط', 'err');
    if (!title) return toast('العنوان مطلوب', 'err');
    if (card && !hpIsHttps(card)) return toast('صورة البطاقة يجب أن تبدأ بـ https://', 'err');
    if (cover && !hpIsHttps(cover)) return toast('صورة الغلاف يجب أن تبدأ بـ https://', 'err');
    if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
    if (start && end && new Date(end) <= new Date(start)) return toast('نهاية الظهور يجب أن تكون بعد البداية', 'err');
    const payload = {
      slug, title_ar: title,
      subtitle_ar: $('lp_sub').value.trim() || null,
      description_ar: $('lp_desc').value.trim() || null,
      card_image_url: card || null, cover_image_url: cover || null,
      sort_order: Number($('lp_order').value) || 0,
      is_active: $('lp_active').checked, starts_at: start, ends_at: end
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const ins = await sb.from('promotion_pages').insert(payload).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء الصفحة');
      } else {
        await hpUpdate('promotion_pages', p.id, payload);
      }
      toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    laOpenPages();
  };
}
