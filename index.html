/* ═══════════════════════════════════════════════════
   SECTION 8b · مجموعات الإضافات وتوفر الفروع
   - addon_groups: مجموعات الإضافات لكل منتج (الاسم، إلزامي، حد أدنى وأقصى، ترتيب، تفعيل)
   - addon_group_options: خيارات المجموعة، ولا تُقبل إلا إضافة مرتبطة بالمنتج عبر item_addons
     (مفتاح أجنبي مركّب: group_item_addon_fk)
   - branch_menu_items: توفر المنتج لكل فرع.
     سياسة القراءة العامة تُظهر الصفوف التي is_available = true فقط، لذلك نعامل غياب الصف
     على أنه «غير متاح»، ونكتب الصف صراحةً عند كل تغيير.
   كل قراءة من Supabase، وكل كتابة يتحقق منها الصف المُرجَع ثم تُعاد القراءة.
   ═══════════════════════════════════════════════════ */
let agItem = null;      // المنتج المختار في شاشة مجموعات الإضافات
let agBranch = null;    // الفرع المختار في شاشة توفر الفروع

/* ---------- مجموعات الإضافات ---------- */
async function agLoad(itemId) {
  const [items, groups, opts, linked, addons] = await Promise.all([
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('addon_groups').select('*').eq('item_id', itemId).order('sort_order'),
    sb.from('addon_group_options').select('*').eq('item_id', itemId).order('sort_order'),
    sb.from('item_addons').select('addon_id').eq('item_id', itemId),
    sb.from('addons').select('id,name_ar,price,is_available').order('name_ar')
  ]);
  for (const r of [items, groups, opts, linked, addons]) if (r.error) throw r.error;
  return {
    items: items.data || [], groups: hpByOrder(groups.data || []), opts: opts.data || [],
    linkedAddonIds: (linked.data || []).map(x => x.addon_id), addons: addons.data || []
  };
}

VIEWS['addon-groups'] = async v => {
  const first = await sb.from('menu_items').select('id').order('name_ar').limit(1);
  if (first.error) throw first.error;
  if (!agItem) agItem = first.data?.[0]?.id || null;
  if (!agItem) { v.innerHTML = '<div class="empty">لا توجد منتجات في قاعدة البيانات بعد</div>'; return; }
  let d;
  try { d = await agLoad(agItem); }
  catch (e) { v.innerHTML = `<div class="empty">تعذر تحميل مجموعات الإضافات: ${esc(hpErrMsg(e))}</div>`; return; }

  const itemName = d.items.find(i => i.id === agItem)?.name_ar || '';
  const addonName = id => d.addons.find(a => a.id === id)?.name_ar || '(إضافة محذوفة)';
  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🧩 مجموعات الإضافات</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        المجموعة تنتمي إلى منتج واحد. خيارات المجموعة تُختار فقط من الإضافات المرتبطة بهذا المنتج من شاشة المنتج.
      </p>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <select id="ag_item" style="flex:1;min-width:200px">${d.items.map(i => `<option value="${i.id}" ${i.id === agItem ? 'selected' : ''}>${esc(i.name_ar)}</option>`).join('')}</select>
        <button class="btn pri" id="ag_new">+ مجموعة جديدة</button>
      </div>
    </div>
    ${d.groups.length === 0 ? `<div class="empty">لا توجد مجموعات إضافات لمنتج «${esc(itemName)}»</div>` : d.groups.map((g, idx) => {
      const myOpts = d.opts.filter(o => o.group_id === g.id);
      const availableToAdd = d.linkedAddonIds.filter(id => !myOpts.some(o => o.addon_id === id));
      return `<div class="set-card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <div><b>${esc(g.name_ar)}</b>
            ${g.is_required ? ' <span class="pay-badge" style="color:var(--warn)">إلزامية</span>' : ' <span class="pay-badge">اختيارية</span>'}
            ${hpBadge(g.is_active ? { l: 'مفعّلة', c: 'var(--ok)' } : { l: 'موقوفة', c: 'var(--ink2)' })}</div>
          <small style="color:var(--ink2)">الاختيار: من ${g.min_select} إلى ${g.max_select} · ترتيب ${g.sort_order}</small>
        </div>
        <div style="margin:10px 0">
          ${myOpts.length === 0 ? '<small style="color:var(--ink2)">لا توجد خيارات بعد</small>' : myOpts.map(o => `<div class="row" style="align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)">
            <span style="flex:1">${esc(addonName(o.addon_id))} <small style="color:var(--ink2)">${o.is_active ? '' : '· موقوف'}</small></span>
            <button class="btn out sm dng" data-ag="opt-rm" data-id="${o.id}">إزالة</button></div>`).join('')}
        </div>
        ${availableToAdd.length === 0 ? `<small style="color:var(--ink2)">${d.linkedAddonIds.length === 0 ? 'لا توجد إضافات مرتبطة بهذا المنتج. اربطها من شاشة المنتج أولًا.' : 'كل الإضافات المرتبطة بالمنتج مضافة لهذه المجموعة.'}</small>` : `
          <div class="row" style="gap:6px"><select id="ag_add_${g.id}" style="flex:1">${availableToAdd.map(id => `<option value="${id}">${esc(addonName(id))}</option>`).join('')}</select>
          <button class="btn pri sm" data-ag="opt-add" data-group="${g.id}">+ خيار</button></div>`}
        <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">
          <button class="btn out sm" data-ag="up" data-id="${g.id}" ${idx === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
          <button class="btn out sm" data-ag="down" data-id="${g.id}" ${idx === d.groups.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>
          <button class="btn out sm" data-ag="edit" data-id="${g.id}">✏️ تعديل</button>
          <button class="btn out sm ${g.is_active ? 'wr' : 'ok'}" data-ag="toggle" data-id="${g.id}">${g.is_active ? 'إيقاف' : 'تفعيل'}</button>
          <button class="btn out sm dng" data-ag="del" data-id="${g.id}">🗑️ حذف المجموعة</button>
        </div>
      </div>`;
    }).join('')}`;

  $('ag_item').onchange = e => { agItem = e.target.value; VIEWS['addon-groups'](v); };
  $('ag_new').onclick = () => agGroupEditor(null, d, v);
  v.onclick = async e => {
    const b = e.target.closest('[data-ag]');
    if (!b) return;
    const act = b.dataset.ag, id = b.dataset.id;
    b.disabled = true;
    try {
      if (act === 'edit') { b.disabled = false; return agGroupEditor(d.groups.find(g => g.id === id), d, v); }
      if (act === 'up' || act === 'down') {
        await hpMove('addon_groups', d.groups, id, act === 'up' ? -1 : 1);
        toast('تم تحديث الترتيب', 'ok');
      } else if (act === 'toggle') {
        const g = d.groups.find(x => x.id === id);
        await hpUpdate('addon_groups', id, { is_active: !g.is_active });
        toast('تم التحديث', 'ok');
      } else if (act === 'del') {
        const g = d.groups.find(x => x.id === id);
        if (!await ask('حذف المجموعة', `سيتم حذف مجموعة «${g.name_ar}» وكل خياراتها نهائيًا. هل أنت متأكد؟`, 'حذف')) { b.disabled = false; return; }
        const r = await sb.from('addon_groups').delete().eq('id', id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
        toast('تم حذف المجموعة', 'ok');
      } else if (act === 'opt-add') {
        const sel = $('ag_add_' + b.dataset.group);
        if (!sel || !sel.value) throw new Error('اختر إضافة أولًا');
        const maxO = d.opts.filter(o => o.group_id === b.dataset.group).reduce((m, o) => Math.max(m, o.sort_order || 0), 0);
        const r = await sb.from('addon_group_options').insert({ group_id: b.dataset.group, item_id: agItem, addon_id: sel.value, sort_order: maxO + 10, is_active: true }).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ الخيار');
        toast('تمت إضافة الخيار', 'ok');
      } else if (act === 'opt-rm') {
        const r = await sb.from('addon_group_options').delete().eq('id', id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم تتم الإزالة: الخيار غير موجود أو ليست لديك صلاحية');
        toast('تمت إزالة الخيار', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS['addon-groups'](v);
  };
};

function agGroupEditor(g, d, v) {
  const isNew = !g;
  const r = g || { name_ar: '', is_required: false, min_select: 0, max_select: 1, sort_order: 0, is_active: true };
  openModal(`<h2>${isNew ? 'مجموعة إضافات جديدة' : 'تعديل المجموعة'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <label>اسم المجموعة *</label><input id="agn_name" maxlength="80" value="${esc(r.name_ar)}">
    <label class="toggle"><span>المجموعة إلزامية</span><input type="checkbox" id="agn_req" ${r.is_required ? 'checked' : ''}></label>
    <label>الحد الأدنى للاختيار</label><input id="agn_min" type="number" min="0" max="20" value="${r.min_select}">
    <label>الحد الأقصى للاختيار</label><input id="agn_max" type="number" min="1" max="20" value="${r.max_select}">
    <label>ترتيب الظهور</label><input id="agn_order" type="number" value="${r.sort_order}">
    <label class="toggle" style="margin-top:12px"><span>مفعّلة</span><input type="checkbox" id="agn_active" ${r.is_active ? 'checked' : ''}></label>
    <div class="row" style="margin-top:14px"><button class="btn pri big" id="agn_save">💾 حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

  $('agn_save').onclick = async () => {
    const btn = $('agn_save');
    const name = $('agn_name').value.trim();
    const req = $('agn_req').checked;
    const min = Number($('agn_min').value), max = Number($('agn_max').value);
    if (!name) return toast('اسم المجموعة مطلوب', 'err');
    if (!Number.isInteger(min) || min < 0) return toast('الحد الأدنى يجب أن يكون رقمًا صحيحًا 0 أو أكثر', 'err');
    if (!Number.isInteger(max) || max < 1) return toast('الحد الأقصى يجب أن يكون 1 أو أكثر', 'err');
    if (min > max) return toast('الحد الأدنى لا يمكن أن يتجاوز الحد الأقصى', 'err');
    if (req && min < 1) return toast('المجموعة الإلزامية تحتاج حدًا أدنى 1 على الأقل', 'err');
    const dup = d.groups.some(x => x.name_ar.trim() === name && x.id !== (g && g.id));
    if (dup) return toast('توجد مجموعة بنفس الاسم لهذا المنتج', 'err');
    const payload = {
      name_ar: name, is_required: req, min_select: min, max_select: max,
      sort_order: Number($('agn_order').value) || 0, is_active: $('agn_active').checked
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const ins = await sb.from('addon_groups').insert({ ...payload, item_id: agItem }).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء المجموعة');
      } else {
        await hpUpdate('addon_groups', g.id, payload);
      }
      closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS['addon-groups'](v);
  };
}

/* ---------- توفر المنتجات بالفروع ---------- */
VIEWS.branches = async v => {
  const [br, items, avail] = await Promise.all([
    sb.from('branches').select('id,name_ar,is_active,sort_order,address_text').order('sort_order'),
    sb.from('menu_items').select('id,name_ar,is_available').order('name_ar'),
    sb.from('branch_menu_items').select('branch_id,item_id,is_available')
  ]);
  for (const r of [br, items, avail]) if (r.error) { v.innerHTML = `<div class="empty">تعذر تحميل بيانات الفروع: ${esc(hpErrMsg(r.error))}</div>`; return; }
  const branches = br.data || [], menu = items.data || [], rows = avail.data || [];
  if (branches.length === 0) { v.innerHTML = '<div class="empty">لا توجد فروع في قاعدة البيانات</div>'; return; }
  if (!agBranch || !branches.some(b => b.id === agBranch)) agBranch = branches[0].id;
  const cur = branches.find(b => b.id === agBranch);
  const stateOf = itemId => {
    const row = rows.find(x => x.branch_id === agBranch && x.item_id === itemId);
    if (!row) return { k: 'unset', l: 'غير متاح (لا يوجد سجل)', c: 'var(--ink2)' };
    return row.is_available ? { k: 'on', l: 'متاح', c: 'var(--ok)' } : { k: 'off', l: 'غير متاح', c: 'var(--err)' };
  };
  const onCount = menu.filter(m => stateOf(m.id).k === 'on').length;

  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🏪 توفر المنتجات بالفروع</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        التوفر يُحدد لكل فرع على حدة. تغيير منتج في فرع لا يؤثر على الفروع الأخرى. المنتج الذي لا يوجد له سجل في الفرع يعتبر غير متاح فيه.
      </p>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <select id="br_sel" style="flex:1;min-width:200px">${branches.map(b => `<option value="${b.id}" ${b.id === agBranch ? 'selected' : ''}>${esc(b.name_ar)}${b.is_active ? '' : ' (موقوف)'}</option>`).join('')}</select>
        <button class="btn out sm" data-br="all-on">تفعيل الكل في هذا الفرع</button>
        <button class="btn out sm dng" data-br="all-off">تعطيل الكل في هذا الفرع</button>
      </div>
      <small style="display:block;margin-top:8px;color:var(--ink2)">متاح في «${esc(cur.name_ar)}»: ${onCount} من ${menu.length} منتج</small>
    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>المنتج</th><th>الحالة في الفرع</th><th>تبديل</th></tr></thead><tbody>
      ${menu.map(m => {
        const s = stateOf(m.id);
        return `<tr><td data-label="المنتج">${esc(m.name_ar)}${m.is_available ? '' : ' <small style="color:var(--ink2)">(موقوف عامًا)</small>'}</td>
          <td data-label="الحالة"><span style="color:${s.c};font-weight:700">${s.l}</span></td>
          <td data-label="تبديل"><button class="btn out sm ${s.k === 'on' ? 'dng' : 'ok'}" data-br="toggle" data-id="${m.id}" data-on="${s.k === 'on' ? '0' : '1'}">${s.k === 'on' ? 'تعطيل هنا' : 'تفعيل هنا'}</button></td></tr>`;
      }).join('')}
    </tbody></table></div>`;

  $('br_sel').onchange = e => { agBranch = e.target.value; VIEWS.branches(v); };
  v.onclick = async e => {
    const b = e.target.closest('[data-br]');
    if (!b) return;
    const act = b.dataset.br;
    b.disabled = true;
    try {
      if (act === 'toggle') {
        const want = b.dataset.on === '1';
        const r = await sb.from('branch_menu_items').upsert([{ branch_id: agBranch, item_id: b.dataset.id, is_available: want }], { onConflict: 'branch_id,item_id' }).select('item_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ التوفر: ليست لديك صلاحية');
        toast(want ? 'متاح في هذا الفرع' : 'غير متاح في هذا الفرع', 'ok');
      } else if (act === 'all-on' || act === 'all-off') {
        const want = act === 'all-on';
        if (!await ask(want ? 'تفعيل الكل' : 'تعطيل الكل', `سيتم ${want ? 'تفعيل' : 'تعطيل'} جميع المنتجات (${menu.length}) في فرع «${cur.name_ar}». هل أنت متأكد؟`, 'تأكيد')) { b.disabled = false; return; }
        const payload = menu.map(m => ({ branch_id: agBranch, item_id: m.id, is_available: want }));
        const r = await sb.from('branch_menu_items').upsert(payload, { onConflict: 'branch_id,item_id' }).select('item_id');
        if (r.error) throw r.error;
        if ((r.data || []).length !== payload.length) throw new Error('لم تُحفظ كل المنتجات: تحقق من الصلاحيات ثم أعد المحاولة');
        toast('تم التحديث في قاعدة البيانات', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.branches(v);
  };
};


/* ═══════════════════════════════════════════════════
   SECTION 10b · إدارة الشارات الموحدة
   - تعريف الشارة نفسها: display_badges (الاسم، النص، الألوان، الشكل، الموضع، الحركة، الأولوية، الجدولة)
   - ربط الشارة بالمنتجات: menu_item_badges
   - ربط الشارة بالتصنيفات: category_badges
   - ربط الشارة بالعروض: promotion_badges
   القيم المسموحة مأخوذة من قيود قاعدة البيانات الفعلية (CHECK constraints).
   لا يوجد حذف للشارة: قد تكون مرتبطة بعروض، فنستعمل الإيقاف بدلًا من الحذف.
   ═══════════════════════════════════════════════════ */
const BD_SHAPES = { pill: 'كبسولة', rounded: 'مستديرة', square: 'مربعة', ribbon: 'شريط', circle: 'دائرية' };
const BD_POSITIONS = { top_left: 'أعلى يسار', top_right: 'أعلى يمين', bottom_left: 'أسفل يسار', bottom_right: 'أسفل يمين', above_title: 'فوق العنوان', inline: 'داخل السطر' };
const BD_ANIMATIONS = { none: 'بدون حركة', pulse: 'نبض', bounce: 'قفز', shake: 'اهتزاز', shimmer: 'لمعان' };
const BD_WEIGHTS = { '400': 'عادي', '600': 'متوسط', '700': 'عريض', '800': 'عريض جدًا' };

function bdRadius(shape) {
  return { pill: '999px', rounded: '10px', square: '0', ribbon: '4px 14px', circle: '50%' }[shape] || '999px';
}
/* معاينة مطابقة للخصائص المحفوظة */
function bdPreview(b) {
  const bord = Number(b.border_width_px) > 0 ? `${Number(b.border_width_px)}px solid ${b.border_color || 'transparent'}` : 'none';
  const pad = b.shape === 'circle' ? '6px 10px' : '3px 12px';
  return `<span class="bd-prev" style="display:inline-block;padding:${pad};border-radius:${bdRadius(b.shape)};border:${bord};background:${esc(b.background_color)};color:${esc(b.text_color)};font-size:${Number(b.font_size_px) || 12}px;font-weight:${esc(b.font_weight || '700')};font-family:${esc(b.font_family || 'inherit')};white-space:nowrap">${b.icon ? esc(b.icon) + ' ' : ''}${esc(b.label_ar)}</span>`;
}

async function bdLoad() {
  const r = await sb.from('display_badges').select('*').order('priority', { ascending: false }).order('created_at');
  if (r.error) throw r.error;
  return r.data || [];
}

VIEWS.badges = async v => {
  let rows;
  try { rows = await bdLoad(); }
  catch (e) { v.innerHTML = `<div class="empty">تعذر تحميل الشارات: ${esc(hpErrMsg(e))}</div>`; return; }
  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🏷️ الشارات</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        الشارة تعريف واحد يمكن ربطه بالمنتجات والتصنيفات والعروض. الشارة الموقوفة لا تظهر للعميل حتى لو كانت مرتبطة.
        لا يوجد حذف للشارة لأنها قد تكون مرتبطة بعروض، استخدم الإيقاف.
      </p>
      <button class="btn pri" id="bd_new">+ شارة جديدة</button>
    </div>
    ${rows.length === 0 ? '<div class="empty">لا توجد شارات بعد</div>' : rows.map(b => {
      const st = hpStatus({ is_active: b.is_active, starts_at: b.starts_at, ends_at: b.ends_at });
      return `<div class="set-card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <div>${bdPreview(b)} <small style="color:var(--ink2)">${esc(b.name)}</small> ${hpBadge(st)}</div>
          <small style="color:var(--ink2)">أولوية ${b.priority}</small>
        </div>
        <div style="font-size:12px;color:var(--ink2);margin:6px 0">الشكل: ${esc(BD_SHAPES[b.shape] || b.shape)} · الموضع: ${esc(BD_POSITIONS[b.position] || b.position)} · الحركة: ${esc(BD_ANIMATIONS[b.animation] || b.animation)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn out sm" data-bd="edit" data-id="${b.id}">✏️ تعديل</button>
          <button class="btn out sm" data-bd="links" data-id="${b.id}">🔗 الربط</button>
          <button class="btn out sm ${b.is_active ? 'wr' : 'ok'}" data-bd="toggle" data-id="${b.id}">${b.is_active ? 'إيقاف' : 'تفعيل'}</button>
        </div>
      </div>`;
    }).join('')}`;

  $('bd_new').onclick = () => bdEditor(null, rows, v);
  v.onclick = async e => {
    const b = e.target.closest('[data-bd]');
    if (!b) return;
    const row = rows.find(x => x.id === b.dataset.id);
    const act = b.dataset.bd;
    if (act === 'edit') return bdEditor(row, rows, v);
    if (act === 'links') return bdLinks(row, v);
    b.disabled = true;
    try {
      await hpUpdate('display_badges', row.id, { is_active: !row.is_active });
      toast(row.is_active ? 'تم إيقاف الشارة' : 'تم تفعيل الشارة', 'ok');
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.badges(v);
  };
};

function bdEditor(b, rows, v) {
  const isNew = !b;
  const r = b || { name: '', label_ar: '', icon: '', text_color: '#ffffff', background_color: '#e11d48', border_color: '', border_width_px: 0, font_size_px: 12, font_weight: '700', font_family: '', shape: 'pill', position: 'top_right', animation: 'none', priority: 0, is_active: true, starts_at: null, ends_at: null };
  const opts = (map, cur) => Object.entries(map).map(([k, l]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('');
  openModal(`<h2>${isNew ? 'شارة جديدة' : 'تعديل الشارة'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <label>المعرّف الداخلي * <small>بالإنجليزية وبدون مسافات، مثل new_arrival</small></label><input id="bd_name" dir="ltr" maxlength="60" value="${esc(r.name)}">
    <label>النص الظاهر للعميل *</label><input id="bd_label" maxlength="40" value="${esc(r.label_ar)}">
    <label>أيقونة (اختياري)</label><input id="bd_icon" maxlength="4" value="${esc(r.icon || '')}">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label>لون النص</label><input id="bd_tc" dir="ltr" value="${esc(r.text_color)}"></div>
      <div style="flex:1"><label>لون الخلفية</label><input id="bd_bg" dir="ltr" value="${esc(r.background_color)}"></div>
    </div>
    <div class="row" style="gap:8px">
      <div style="flex:1"><label>لون الحد (اختياري)</label><input id="bd_bc" dir="ltr" value="${esc(r.border_color || '')}"></div>
      <div style="flex:1"><label>عرض الحد (0 - 10)</label><input id="bd_bw" type="number" min="0" max="10" value="${r.border_width_px}"></div>
    </div>
    <div class="row" style="gap:8px">
      <div style="flex:1"><label>حجم الخط (8 - 40)</label><input id="bd_fs" type="number" min="8" max="40" value="${r.font_size_px}"></div>
      <div style="flex:1"><label>سماكة الخط</label><select id="bd_fw">${Object.entries(BD_WEIGHTS).map(([k, l]) => `<option value="${k}" ${String(r.font_weight) === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <label>الشكل</label><select id="bd_shape">${opts(BD_SHAPES, r.shape)}</select>
    <label>الموضع</label><select id="bd_pos">${opts(BD_POSITIONS, r.position)}</select>
    <label>الحركة</label><select id="bd_anim">${opts(BD_ANIMATIONS, r.animation)}</select>
    <label>الأولوية <small>الأعلى يظهر أولًا</small></label><input id="bd_prio" type="number" value="${r.priority}">
    <label>بداية الظهور (اختياري)</label><input id="bd_start" type="datetime-local" value="${hpToLocal(r.starts_at)}">
    <label>نهاية الظهور (اختياري)</label><input id="bd_end" type="datetime-local" value="${hpToLocal(r.ends_at)}">
    <label class="toggle" style="margin-top:12px"><span>مفعّلة</span><input type="checkbox" id="bd_active" ${r.is_active ? 'checked' : ''}></label>
    <div style="margin:12px 0;padding:12px;border-radius:12px;background:var(--bg2)"><small style="color:var(--ink2)">معاينة</small><div id="bd_prev" style="margin-top:6px"></div></div>
    <div class="row" style="margin-top:6px"><button class="btn pri big" id="bd_save">💾 حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

  const current = () => ({
    label_ar: $('bd_label').value.trim() || '—', icon: $('bd_icon').value.trim(),
    text_color: $('bd_tc').value.trim() || '#000000', background_color: $('bd_bg').value.trim() || '#ffffff',
    border_color: $('bd_bc').value.trim(), border_width_px: Number($('bd_bw').value) || 0,
    font_size_px: Number($('bd_fs').value) || 12, font_weight: $('bd_fw').value,
    shape: $('bd_shape').value
  });
  const paint = () => { $('bd_prev').innerHTML = bdPreview(current()); };
  ['bd_label', 'bd_icon', 'bd_tc', 'bd_bg', 'bd_bc', 'bd_bw', 'bd_fs', 'bd_fw', 'bd_shape'].forEach(id => $(id).oninput = $(id).onchange = paint);
  paint();

  $('bd_save').onclick = async () => {
    const btn = $('bd_save');
    const name = $('bd_name').value.trim();
    const c = current();
    const fs = Number($('bd_fs').value), bw = Number($('bd_bw').value), prio = Number($('bd_prio').value);
    const start = hpFromLocal($('bd_start').value), end = hpFromLocal($('bd_end').value);
    if (!/^[a-z0-9_]+$/.test(name)) return toast('المعرّف الداخلي يجب أن يكون بحروف إنجليزية صغيرة وأرقام وشرطة سفلية', 'err');
    if (rows.some(x => x.name === name && (!b || x.id !== b.id))) return toast('يوجد معرّف داخلي بنفس الاسم', 'err');
    if (!$('bd_label').value.trim()) return toast('النص الظاهر مطلوب', 'err');
    if (!hpIsHex(c.text_color) || !hpIsHex(c.background_color) || (c.border_color && !hpIsHex(c.border_color))) return toast('الألوان يجب أن تكون بصيغة #RRGGBB', 'err');
    if (!Number.isInteger(fs) || fs < 8 || fs > 40) return toast('حجم الخط بين 8 و 40', 'err');
    if (!Number.isInteger(bw) || bw < 0 || bw > 10) return toast('عرض الحد بين 0 و 10', 'err');
    if (!Number.isInteger(prio)) return toast('الأولوية يجب أن تكون رقمًا صحيحًا', 'err');
    if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
    if (start && end && new Date(end) <= new Date(start)) return toast('نهاية الظهور يجب أن تكون بعد البداية', 'err');
    const payload = { ...c, name, priority: prio, position: $('bd_pos').value, animation: $('bd_anim').value,
      is_active: $('bd_active').checked, starts_at: start, ends_at: end, icon: c.icon || null,
      border_color: c.border_color || null, font_family: null };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const ins = await sb.from('display_badges').insert(payload).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء الشارة');
      } else {
        await hpUpdate('display_badges', b.id, payload);
      }
      closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS.badges(v);
  };
}

/* ربط الشارة: منتجات، تصنيفات، عروض */
async function bdLinks(b, v) {
  const [mi, ci, pi, items, cats, promos] = await Promise.all([
    sb.from('menu_item_badges').select('item_id').eq('badge_id', b.id),
    sb.from('category_badges').select('category_id').eq('badge_id', b.id),
    sb.from('promotion_badges').select('promotion_id').eq('badge_id', b.id),
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('categories').select('id,name_ar').order('name_ar'),
    sb.from('menu_promotions').select('id,name_ar').order('name_ar')
  ]);
  for (const x of [mi, ci, pi, items, cats, promos]) if (x.error) return fail(x.error, hpErrMsg(x.error));
  const itemIds = new Set((mi.data || []).map(x => x.item_id));
  const catIds = new Set((ci.data || []).map(x => x.category_id));
  const promoIds = new Set((pi.data || []).map(x => x.promotion_id));
  const nm = (list, id) => list.find(x => x.id === id)?.name_ar || '(محذوف)';

  const section = (title, ids, list, kind, rmKey, addKey) => `<div class="set-card" style="margin-bottom:10px">
    <h3>${title} (${ids.size})</h3>
    ${ids.size === 0 ? '<small style="color:var(--ink2)">لا يوجد ربط</small>' : [...ids].map(id => `<div class="row" style="align-items:center;gap:6px;padding:4px 0"><span style="flex:1">${esc(nm(list, id))}</span>
      <button class="btn out sm dng" data-bl="${rmKey}" data-id="${id}">إزالة</button></div>`).join('')}
    <div class="row" style="margin-top:8px;gap:6px">
      <select id="bl_${kind}" style="flex:1"><option value="">— اختر —</option>${list.filter(x => !ids.has(x.id)).map(x => `<option value="${x.id}">${esc(x.name_ar)}</option>`).join('')}</select>
      <button class="btn pri sm" data-bl="${addKey}">+ ربط</button></div>
  </div>`;

  openModal(`<h2>🔗 ربط الشارة: ${esc(b.label_ar)} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    ${section('🛒 المنتجات', itemIds, items.data || [], 'item', 'rm-item', 'add-item')}
    ${section('📂 التصنيفات', catIds, cats.data || [], 'cat', 'rm-cat', 'add-cat')}
    ${section('🎁 العروض', promoIds, promos.data || [], 'promo', 'rm-promo', 'add-promo')}`);

  const reopen = () => bdLinks(b, v);
  $('mod').onclick = async e => {
    const btn = e.target.closest('[data-bl]');
    if (!btn) return;
    const act = btn.dataset.bl;
    btn.disabled = true;
    try {
      if (act === 'add-item' || act === 'add-cat' || act === 'add-promo') {
        const kind = act.replace('add-', '');
        const val = $('bl_' + (kind === 'item' ? 'item' : kind === 'cat' ? 'cat' : 'promo')).value;
        if (!val) throw new Error('اختر عنصرًا أولًا');
        const table = kind === 'item' ? ['menu_item_badges', 'item_id'] : kind === 'cat' ? ['category_badges', 'category_id'] : ['promotion_badges', 'promotion_id'];
        const sortRows = kind === 'item' ? [...itemIds] : kind === 'cat' ? [...catIds] : [...promoIds];
        const r = await sb.from(table[0]).insert({ badge_id: b.id, [table[1]]: val, sort_order: (sortRows.length + 1) * 10 }).select('badge_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ الربط');
        toast('تم الربط في قاعدة البيانات', 'ok');
      } else if (act.startsWith('rm-')) {
        const kind = act.slice(3);
        const map = { item: ['menu_item_badges', 'item_id'], cat: ['category_badges', 'category_id'], promo: ['promotion_badges', 'promotion_id'] }[kind];
        const r = await sb.from(map[0]).delete().eq('badge_id', b.id).eq(map[1], btn.dataset.id).select('badge_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم تتم الإزالة: الربط غير موجود أو ليست لديك صلاحية');
        toast('تمت الإزالة', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    reopen();
  };
}

/* ═══════════════════════════════════════════════════
   SECTION 8c · إدارة الفروع
   جدول branches: الاسم والمعرّف المختصر (فريد) والعنوان والهاتف والإحداثيات والتفعيل والترتيب.
   القيود المعتمدة من قاعدة البيانات: الاسم غير فارغ، slug فريد وغير فارغ،
   الإحداثيات زوج واحد (خط العرض والطول معًا أو لا شيء)، ونطاقها -90..90 و-180..180.
   تُضاف هذه الإدارة فوق شاشة توفر المنتجات بالفروع دون استبدال منطقها.
   ═══════════════════════════════════════════════════ */
function brValidatePhone(p) { return !p || /^\+?[0-9 ()-]{6,20}$/.test(p); }

function brEditor(b, v) {
  const isNew = !b;
  const r = b || { slug: '', name_ar: '', address_text: '', phone: '', latitude: null, longitude: null, is_active: true, sort_order: 0 };
  openModal(`<h2>${isNew ? 'فرع جديد' : 'تعديل الفرع'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <label>اسم الفرع *</label><input id="brn_name" maxlength="80" value="${esc(r.name_ar)}">
    <label>المعرّف المختصر (slug) * <small>حروف إنجليزية صغيرة وأرقام وشرطة، ويجب أن يكون فريدًا</small></label>
    <input id="brn_slug" dir="ltr" maxlength="40" value="${esc(r.slug)}" ${isNew ? '' : 'readonly title="المعرّف المختصر لا يتغير بعد الإنشاء"'}>
    <label>العنوان</label><input id="brn_addr" maxlength="200" value="${esc(r.address_text || '')}">
    <label>الهاتف</label><input id="brn_phone" dir="ltr" maxlength="20" value="${esc(r.phone || '')}">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label>خط العرض</label><input id="brn_lat" dir="ltr" value="${r.latitude ?? ''}"></div>
      <div style="flex:1"><label>خط الطول</label><input id="brn_lng" dir="ltr" value="${r.longitude ?? ''}"></div>
    </div>
    <label>ترتيب الظهور</label><input id="brn_order" type="number" value="${r.sort_order}">
    <label class="toggle" style="margin-top:12px"><span>الفرع نشط</span><input type="checkbox" id="brn_active" ${r.is_active ? 'checked' : ''}></label>
    <div class="row" style="margin-top:14px"><button class="btn pri big" id="brn_save">💾 حفظ</button>
    <button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

  $('brn_save').onclick = async () => {
    const btn = $('brn_save');
    const name = $('brn_name').value.trim();
    const slug = $('brn_slug').value.trim().toLowerCase();
    const phone = $('brn_phone').value.trim();
    const latRaw = $('brn_lat').value.trim(), lngRaw = $('brn_lng').value.trim();
    if (!name) return toast('اسم الفرع مطلوب', 'err');
    if (isNew && !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return toast('المعرّف المختصر يجب أن يكون بحروف إنجليزية صغيرة وأرقام وشرطة فقط', 'err');
    if (!brValidatePhone(phone)) return toast('رقم الهاتف غير صالح', 'err');
    if ((latRaw === '') !== (lngRaw === '')) return toast('أدخل خط العرض والطول معًا أو اتركهما فارغين', 'err');
    let lat = null, lng = null;
    if (latRaw !== '') {
      lat = Number(latRaw); lng = Number(lngRaw);
      if (!Number.isFinite(lat) || lat < -90 || lat > 90) return toast('خط العرض يجب أن يكون بين -90 و 90', 'err');
      if (!Number.isFinite(lng) || lng < -180 || lng > 180) return toast('خط الطول يجب أن يكون بين -180 و 180', 'err');
    }
    const order = Number($('brn_order').value);
    if (!Number.isInteger(order)) return toast('ترتيب الظهور يجب أن يكون رقمًا صحيحًا', 'err');
    const payload = {
      name_ar: name, address_text: $('brn_addr').value.trim() || null, phone: phone || null,
      latitude: lat, longitude: lng, sort_order: order, is_active: $('brn_active').checked
    };
    btn.disabled = true; btn.textContent = '⏳ حفظ...';
    try {
      if (isNew) {
        const ins = await sb.from('branches').insert({ ...payload, slug }).select('id').single();
        if (ins.error) throw ins.error;
        if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء الفرع');
      } else {
        await hpUpdate('branches', b.id, payload);
      }
      closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
    } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
    VIEWS.branches(v);
  };
}

/* تُضاف فوق شاشة الفروع الأصلية (تغليف لا استبدال) */
const _brOriginalBranches = VIEWS.branches;
VIEWS.branches = async v => {
  await _brOriginalBranches(v);
  let rows = [];
  const r = await sb.from('branches').select('*').order('sort_order');
  if (r.error) {
    v.insertAdjacentHTML('afterbegin', `<div class="empty" style="margin-bottom:12px">تعذر تحميل إدارة الفروع: ${esc(hpErrMsg(r.error))}</div>`);
    return;
  }
  rows = r.data || [];
  const host = document.createElement('div');
  host.id = 'br-manage';
  host.style.marginBottom = '14px';
  host.innerHTML = `
    <div class="set-card" style="margin-bottom:10px">
      <h3>🏪 الفروع</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        الفرع الموقوف لا يستقبل طلبات جديدة. المعرّف المختصر لا يتغير بعد الإنشاء.
      </p>
      <button class="btn pri" data-brm="new">+ فرع جديد</button>
    </div>
    ${rows.length === 0 ? '<div class="empty">لا توجد فروع بعد</div>' : `<div class="table-wrap"><table class="tbl"><thead><tr><th>الفرع</th><th>المعرّف</th><th>الهاتف</th><th>الإحداثيات</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${rows.map(b => `<tr>
        <td data-label="الفرع"><b>${esc(b.name_ar)}</b><br><small style="color:var(--ink2)">${esc(b.address_text || '')}</small></td>
        <td data-label="المعرّف" dir="ltr">${esc(b.slug)}</td>
        <td data-label="الهاتف" dir="ltr">${esc(b.phone || '—')}</td>
        <td data-label="الإحداثيات" dir="ltr">${b.latitude != null && b.longitude != null ? `${b.latitude}, ${b.longitude}` : '—'}</td>
        <td data-label="الحالة">${hpBadge(b.is_active ? { l: 'نشط', c: 'var(--ok)' } : { l: 'موقوف', c: 'var(--ink2)' })}</td>
        <td data-label=""><div class="row" style="gap:6px">
          <button class="btn out sm" data-brm="edit" data-id="${b.id}">✏️</button>
          <button class="btn out sm ${b.is_active ? 'wr' : 'ok'}" data-brm="toggle" data-id="${b.id}">${b.is_active ? 'إيقاف' : 'تفعيل'}</button>
        </div></td></tr>`).join('')}
      </tbody></table></div>`}`;
  v.insertBefore(host, v.firstChild);

  host.onclick = async e => {
    const b = e.target.closest('[data-brm]');
    if (!b) return;
    const act = b.dataset.brm;
    if (act === 'new') return brEditor(null, v);
    const row = rows.find(x => x.id === b.dataset.id);
    if (act === 'edit') return brEditor(row, v);
    if (act === 'toggle') {
      b.disabled = true;
      try {
        if (row.is_active && !await ask('إيقاف الفرع', `إيقاف «${row.name_ar}» يمنعه من استقبال الطلبات. هل تريد المتابعة؟`, 'إيقاف')) { b.disabled = false; return; }
        await hpUpdate('branches', row.id, { is_active: !row.is_active });
        toast(row.is_active ? 'تم إيقاف الفرع' : 'تم تفعيل الفرع', 'ok');
      } catch (err) { fail(err, hpErrMsg(err)); }
      VIEWS.branches(v);
    }
  };
};

/* ═══════════════════════════════════════════════════
   SECTION 16b · ربط الجداول المتبقية التي تديرها الإدارة
   - loyalty_levels: مستويات الولاء (القيد: min_points >= 0)
   - product_recommendation_placements: أماكن توصية المنتجات والإضافات
   - app_content: محتوى التطبيق (مفتاح فريد: group_key + item_key، والقيمة JSON كائن)
   - branch_item_sizes: سعر الحجم في كل فرع (sale_price بين 0 وأقل من price)
   - branch_addons: سعر الإضافة في كل فرع (sale_price أقل من price)
   الصف الغائب في الفرع يعني غير متاح فيه. هذا مطابق لشروط create_order/preview_order_quote
   التي تشترط وجود الصف مع is_available = true.
   ═══════════════════════════════════════════════════ */
const LK_PLACEMENTS = { homepage: 'الصفحة الرئيسية', menu: 'المنيو', product_detail: 'صفحة المنتج', cart: 'السلة', checkout: 'الدفع', order_history: 'سجل الطلبات', order_detail: 'تفاصيل الطلب' };
const LK_ITEM_TYPES = { product: 'منتج', addon: 'إضافة' };
let lkBranch = null;

function lkNum(v) { if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : NaN; }

/* ---------- مستويات الولاء ---------- */
VIEWS.loyalty = async v => {
  const r = await sb.from('loyalty_levels').select('*').order('min_points').order('sort_order');
  if (r.error) { v.innerHTML = `<div class="empty">تعذر تحميل المستويات: ${esc(hpErrMsg(r.error))}</div>`; return; }
  const rows = r.data || [];
  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🏅 مستويات الولاء</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        المستوى يُمنح عند بلوغ الحد الأدنى من النقاط. المستوى الموقوف لا يظهر للعميل. لا يوجد حذف لأن المستويات قد تكون مستخدمة في تقارير سابقة.
      </p>
      <button class="btn pri" id="lv_new">+ مستوى جديد</button>
    </div>
    ${rows.length === 0 ? '<div class="empty">لا توجد مستويات بعد</div>' : `<div class="table-wrap"><table class="tbl"><thead><tr><th>المستوى</th><th>الحد الأدنى للنقاط</th><th>الترتيب</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${rows.map(x => `<tr><td data-label="المستوى"><b>${esc(x.name_ar)}</b></td><td data-label="النقاط" dir="ltr">${x.min_points}</td><td data-label="الترتيب">${x.sort_order}</td>
        <td data-label="الحالة">${hpBadge(x.is_active ? { l: 'مفعّل', c: 'var(--ok)' } : { l: 'موقوف', c: 'var(--ink2)' })}</td>
        <td data-label=""><div class="row" style="gap:6px"><button class="btn out sm" data-lv="edit" data-id="${x.id}">✏️</button>
        <button class="btn out sm ${x.is_active ? 'wr' : 'ok'}" data-lv="toggle" data-id="${x.id}">${x.is_active ? 'إيقاف' : 'تفعيل'}</button></div></td></tr>`).join('')}
    </tbody></table></div>`}`;

  const editor = x => {
    const isNew = !x;
    const d = x || { name_ar: '', min_points: 0, sort_order: 0, is_active: true };
    openModal(`<h2>${isNew ? 'مستوى جديد' : 'تعديل المستوى'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
      <label>اسم المستوى *</label><input id="lv_name" maxlength="60" value="${esc(d.name_ar)}">
      <label>الحد الأدنى للنقاط * <small>عدد صحيح 0 أو أكثر</small></label><input id="lv_min" type="number" min="0" value="${d.min_points}">
      <label>الترتيب</label><input id="lv_order" type="number" value="${d.sort_order}">
      <label class="toggle" style="margin-top:12px"><span>مفعّل</span><input type="checkbox" id="lv_active" ${d.is_active ? 'checked' : ''}></label>
      <div class="row" style="margin-top:14px"><button class="btn pri big" id="lv_save">💾 حفظ</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
    $('lv_save').onclick = async () => {
      const btn = $('lv_save');
      const name = $('lv_name').value.trim();
      const min = Number($('lv_min').value), order = Number($('lv_order').value);
      if (!name) return toast('اسم المستوى مطلوب', 'err');
      if (!Number.isInteger(min) || min < 0) return toast('الحد الأدنى للنقاط يجب أن يكون عددًا صحيحًا 0 أو أكثر', 'err');
      if (!Number.isInteger(order)) return toast('الترتيب يجب أن يكون عددًا صحيحًا', 'err');
      if (rows.some(y => y.name_ar.trim() === name && (!x || y.id !== x.id))) return toast('يوجد مستوى بنفس الاسم', 'err');
      const payload = { name_ar: name, min_points: min, sort_order: order, is_active: $('lv_active').checked };
      btn.disabled = true; btn.textContent = '⏳ حفظ...';
      try {
        if (isNew) {
          const ins = await sb.from('loyalty_levels').insert(payload).select('id').single();
          if (ins.error) throw ins.error;
          if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء المستوى');
        } else await hpUpdate('loyalty_levels', x.id, payload);
        closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
      } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
      VIEWS.loyalty(v);
    };
  };
  $('lv_new').onclick = () => editor(null);
  v.onclick = async e => {
    const b = e.target.closest('[data-lv]'); if (!b) return;
    const x = rows.find(y => y.id === b.dataset.id);
    if (b.dataset.lv === 'edit') return editor(x);
    b.disabled = true;
    try { await hpUpdate('loyalty_levels', x.id, { is_active: !x.is_active }); toast('تم التحديث', 'ok'); }
    catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.loyalty(v);
  };
};

/* ---------- توصيات المنتجات ---------- */
VIEWS.recommendations = async v => {
  const [pl, items, addons, branches] = await Promise.all([
    sb.from('product_recommendation_placements').select('*').order('sort_order').order('created_at'),
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('addons').select('id,name_ar').order('name_ar'),
    sb.from('branches').select('id,name_ar').order('sort_order')
  ]);
  for (const r of [pl, items, addons, branches]) if (r.error) { v.innerHTML = `<div class="empty">تعذر تحميل التوصيات: ${esc(hpErrMsg(r.error))}</div>`; return; }
  const rows = hpByOrder(pl.data || []);
  const nameOf = (type, id) => (type === 'addon' ? addons.data : items.data).find(x => x.id === id)?.name_ar || '(محذوف)';
  const brName = id => id ? (branches.data.find(b => b.id === id)?.name_ar || '(فرع محذوف)') : 'كل الفروع';

  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🎯 توصيات المنتجات</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        تحدد المنتجات أو الإضافات التي تُعرض كتوصية في كل موضع. التوصية الموقوفة أو خارج فترتها لا تظهر للعميل.
      </p>
      <button class="btn pri" id="rc_new">+ توصية جديدة</button>
    </div>
    ${rows.length === 0 ? '<div class="empty">لا توجد توصيات بعد</div>' : rows.map((p, idx) => `
      <div class="set-card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <div><b>${esc(nameOf(p.item_type, p.item_id))}</b> <small style="color:var(--ink2)">${esc(LK_ITEM_TYPES[p.item_type] || p.item_type)}</small> ${hpBadge(hpStatus(p))}</div>
          <small style="color:var(--ink2)">ترتيب ${p.sort_order}</small>
        </div>
        <div style="font-size:12px;color:var(--ink2);margin:6px 0">الموضع: ${esc(LK_PLACEMENTS[p.placement_key] || p.placement_key)} · الفرع: ${esc(brName(p.branch_id))}</div>
        ${p.title_override ? `<div style="font-size:12px">العنوان: ${esc(p.title_override)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          <button class="btn out sm" data-rc="up" data-id="${p.id}" ${idx === 0 ? 'disabled' : ''} aria-label="تحريك لأعلى">↑</button>
          <button class="btn out sm" data-rc="down" data-id="${p.id}" ${idx === rows.length - 1 ? 'disabled' : ''} aria-label="تحريك لأسفل">↓</button>
          <button class="btn out sm" data-rc="edit" data-id="${p.id}">✏️ تعديل</button>
          <button class="btn out sm ${p.is_active ? 'wr' : 'ok'}" data-rc="toggle" data-id="${p.id}">${p.is_active ? 'إيقاف' : 'تفعيل'}</button>
          <button class="btn out sm dng" data-rc="del" data-id="${p.id}">🗑️ حذف</button>
        </div></div>`).join('')}`;

  const editor = p => {
    const isNew = !p;
    const d = p || { item_type: 'product', item_id: null, placement_key: 'menu', branch_id: null, title_override: '', description_override: '', sort_order: 0, is_active: true, starts_at: null, ends_at: null };
    const itemOpts = t => (t === 'addon' ? addons.data : items.data).map(x => `<option value="${x.id}" ${d.item_id === x.id ? 'selected' : ''}>${esc(x.name_ar)}</option>`).join('');
    openModal(`<h2>${isNew ? 'توصية جديدة' : 'تعديل التوصية'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
      <label>نوع العنصر *</label><select id="rc_type">${Object.entries(LK_ITEM_TYPES).map(([k, l]) => `<option value="${k}" ${d.item_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label>العنصر *</label><select id="rc_item"></select>
      <label>الموضع *</label><select id="rc_pl">${Object.entries(LK_PLACEMENTS).map(([k, l]) => `<option value="${k}" ${d.placement_key === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label>الفرع</label><select id="rc_br"><option value="">كل الفروع</option>${branches.data.map(b => `<option value="${b.id}" ${d.branch_id === b.id ? 'selected' : ''}>${esc(b.name_ar)}</option>`).join('')}</select>
      <label>عنوان مخصص (اختياري)</label><input id="rc_title" maxlength="80" value="${esc(d.title_override || '')}">
      <label>وصف مخصص (اختياري)</label><input id="rc_desc" maxlength="200" value="${esc(d.description_override || '')}">
      <label>الترتيب</label><input id="rc_order" type="number" value="${d.sort_order}">
      <label>بداية الظهور (اختياري)</label><input id="rc_start" type="datetime-local" value="${hpToLocal(d.starts_at)}">
      <label>نهاية الظهور (اختياري)</label><input id="rc_end" type="datetime-local" value="${hpToLocal(d.ends_at)}">
      <label class="toggle" style="margin-top:12px"><span>مفعّلة</span><input type="checkbox" id="rc_active" ${d.is_active ? 'checked' : ''}></label>
      <div class="row" style="margin-top:14px"><button class="btn pri big" id="rc_save">💾 حفظ</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
    const fillItems = () => { $('rc_item').innerHTML = `<option value="">— اختر —</option>` + itemOpts($('rc_type').value); $('rc_item').value = (d.item_id && $('rc_type').value === d.item_type) ? d.item_id : ''; };
    fillItems();
    $('rc_type').onchange = fillItems;

    $('rc_save').onclick = async () => {
      const btn = $('rc_save');
      const type = $('rc_type').value, item = $('rc_item').value, pl = $('rc_pl').value, br = $('rc_br').value || null;
      const start = hpFromLocal($('rc_start').value), end = hpFromLocal($('rc_end').value);
      const order = Number($('rc_order').value);
      if (!item) return toast('اختر العنصر', 'err');
      if (!Number.isInteger(order)) return toast('الترتيب يجب أن يكون عددًا صحيحًا', 'err');
      if (start === 'INVALID' || end === 'INVALID') return toast('تاريخ غير صالح', 'err');
      if (start && end && new Date(end) <= new Date(start)) return toast('نهاية الظهور يجب أن تكون بعد البداية', 'err');
      if (rows.some(x => x.item_id === item && x.placement_key === pl && (x.branch_id || null) === br && (!p || x.id !== p.id)))
        return toast('هذا العنصر مضاف بالفعل في نفس الموضع والفرع', 'err');
      const payload = { item_type: type, item_id: item, placement_key: pl, branch_id: br,
        title_override: $('rc_title').value.trim() || null, description_override: $('rc_desc').value.trim() || null,
        sort_order: order, is_active: $('rc_active').checked, starts_at: start, ends_at: end };
      btn.disabled = true; btn.textContent = '⏳ حفظ...';
      try {
        if (isNew) {
          const ins = await sb.from('product_recommendation_placements').insert(payload).select('id').single();
          if (ins.error) throw ins.error;
          if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء التوصية');
        } else await hpUpdate('product_recommendation_placements', p.id, payload);
        closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
      } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
      VIEWS.recommendations(v);
    };
  };

  $('rc_new').onclick = () => editor(null);
  v.onclick = async e => {
    const b = e.target.closest('[data-rc]'); if (!b) return;
    const act = b.dataset.rc, p = rows.find(x => x.id === b.dataset.id);
    try {
      if (act === 'edit') return editor(p);
      if (act === 'up' || act === 'down') { await hpMove('product_recommendation_placements', rows, p.id, act === 'up' ? -1 : 1); toast('تم تحديث الترتيب', 'ok'); }
      else if (act === 'toggle') { await hpUpdate('product_recommendation_placements', p.id, { is_active: !p.is_active }); toast('تم التحديث', 'ok'); }
      else if (act === 'del') {
        if (!await ask('حذف التوصية', 'ستُحذف هذه التوصية نهائيًا. هل أنت متأكد؟', 'حذف')) return;
        const r = await sb.from('product_recommendation_placements').delete().eq('id', p.id).select('id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
        toast('تم الحذف', 'ok');
      }
    } catch (err) { fail(err, hpErrMsg(err)); }
    VIEWS.recommendations(v);
  };
};

/* ---------- محتوى التطبيق ---------- */
VIEWS['app-content'] = async v => {
  const r = await sb.from('app_content').select('*').order('group_key').order('sort_order');
  if (r.error) { v.innerHTML = `<div class="empty">تعذر تحميل محتوى التطبيق: ${esc(hpErrMsg(r.error))}</div>`; return; }
  const rows = r.data || [];
  const groups = [...new Set(rows.map(x => x.group_key))];
  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>📝 محتوى التطبيق</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        القيمة تُكتب بصيغة JSON كائن، مثل <code>{"value": 20}</code>. المفتاح (المجموعة + المفتاح) فريد لا يتكرر.
      </p>
      <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn pri" id="ac_new">+ عنصر جديد</button></div>
    </div>
    ${groups.length === 0 ? '<div class="empty">لا يوجد محتوى بعد</div>' : groups.map(g => `
      <div class="set-card" style="margin-bottom:10px">
        <h3 dir="ltr" style="font-size:14px">${esc(g)}</h3>
        ${rows.filter(x => x.group_key === g).map(x => `<div class="row" style="align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)">
          <div style="flex:1"><b>${esc(x.label_ar)}</b> <small dir="ltr" style="color:var(--ink2)">${esc(x.item_key)}</small>
            <div dir="ltr" style="font-size:11px;color:var(--ink2);word-break:break-all">${esc(JSON.stringify(x.value))}</div></div>
          ${hpBadge(x.is_active ? { l: 'مفعّل', c: 'var(--ok)' } : { l: 'موقوف', c: 'var(--ink2)' })}
          <button class="btn out sm" data-ac="edit" data-id="${x.id}">✏️</button>
        </div>`).join('')}
      </div>`).join('')}`;

  const isObj = s => { try { const o = JSON.parse(s); return o !== null && typeof o === 'object' && !Array.isArray(o); } catch (_) { return false; } };
  const editor = x => {
    const isNew = !x;
    const d = x || { group_key: '', item_key: '', label_ar: '', value: {}, sort_order: 0, is_active: true };
    openModal(`<h2>${isNew ? 'عنصر محتوى جديد' : 'تعديل المحتوى'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
      <label>المجموعة *</label><input id="ac_g" dir="ltr" maxlength="60" value="${esc(d.group_key)}" ${isNew ? '' : 'readonly'}>
      <label>المفتاح *</label><input id="ac_k" dir="ltr" maxlength="60" value="${esc(d.item_key)}" ${isNew ? '' : 'readonly'}>
      <label>الوصف الظاهر للإدارة *</label><input id="ac_l" maxlength="120" value="${esc(d.label_ar)}">
      <label>القيمة (JSON كائن) *</label><textarea id="ac_v" dir="ltr" style="min-height:120px;font-family:monospace">${esc(JSON.stringify(d.value, null, 2))}</textarea>
      <label>الترتيب</label><input id="ac_o" type="number" value="${d.sort_order}">
      <label class="toggle" style="margin-top:12px"><span>مفعّل</span><input type="checkbox" id="ac_a" ${d.is_active ? 'checked' : ''}></label>
      <div class="row" style="margin-top:14px"><button class="btn pri big" id="ac_save">💾 حفظ</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
    $('ac_save').onclick = async () => {
      const btn = $('ac_save');
      const g = $('ac_g').value.trim(), k = $('ac_k').value.trim(), l = $('ac_l').value.trim();
      const raw = $('ac_v').value.trim();
      if (isNew && (!g || !k)) return toast('المجموعة والمفتاح مطلوبان', 'err');
      if (!l) return toast('الوصف مطلوب', 'err');
      if (!isObj(raw)) return toast('القيمة يجب أن تكون JSON كائنًا صالحًا، مثل {"value": 20}', 'err');
      if (isNew && rows.some(y => y.group_key === g && y.item_key === k)) return toast('هذا المفتاح موجود بالفعل في المجموعة', 'err');
      const order = Number($('ac_o').value);
      if (!Number.isInteger(order)) return toast('الترتيب يجب أن يكون عددًا صحيحًا', 'err');
      const payload = { label_ar: l, value: JSON.parse(raw), sort_order: order, is_active: $('ac_a').checked };
      btn.disabled = true; btn.textContent = '⏳ حفظ...';
      try {
        if (isNew) {
          const ins = await sb.from('app_content').insert({ ...payload, group_key: g, item_key: k }).select('id').single();
          if (ins.error) throw ins.error;
          if (!ins.data?.id) throw new Error('لم يؤكد الخادم إنشاء العنصر');
        } else {
          const up = await sb.from('app_content').update(payload).eq('group_key', x.group_key).eq('item_key', x.item_key).select('group_key');
          if (up.error) throw up.error;
          if (!up.data?.length) throw new Error('لم يُحفظ التعديل: ليست لديك صلاحية أو العنصر غير موجود');
        }
        closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
      } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
      VIEWS['app-content'](v);
    };
  };
  $('ac_new').onclick = () => editor(null);
  v.onclick = e => { const b = e.target.closest('[data-ac]'); if (!b) return; editor(rows.find(y => y.id === b.dataset.id)); };
};

/* ---------- أسعار الأحجام والإضافات لكل فرع ---------- */
VIEWS['branch-pricing'] = async v => {
  const [br, sizes, items, addons, bis, ba] = await Promise.all([
    sb.from('branches').select('id,name_ar').order('sort_order'),
    sb.from('item_sizes').select('id,item_id,label_ar,price,is_available').order('sort_order'),
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('addons').select('id,name_ar,price,is_available').order('name_ar'),
    sb.from('branch_item_sizes').select('*'),
    sb.from('branch_addons').select('*')
  ]);
  for (const r of [br, sizes, items, addons, bis, ba]) if (r.error) { v.innerHTML = `<div class="empty">تعذر تحميل أسعار الفروع: ${esc(hpErrMsg(r.error))}</div>`; return; }
  const branches = br.data || [];
  if (!branches.length) { v.innerHTML = '<div class="empty">لا توجد فروع في قاعدة البيانات</div>'; return; }
  if (!lkBranch || !branches.some(b => b.id === lkBranch)) lkBranch = branches[0].id;
  const itemName = id => items.data.find(x => x.id === id)?.name_ar || '(محذوف)';
  const sizeRow = id => bis.data.find(x => x.branch_id === lkBranch && x.size_id === id);
  const addonRow = id => ba.data.find(x => x.branch_id === lkBranch && x.addon_id === id);
  const money2 = n => (n == null ? '—' : Number(n).toFixed(2));

  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>💲 أسعار الفروع</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        الحجم أو الإضافة الذي لا يوجد له سعر في الفرع يعتبر غير متاح فيه. سعر الفرع يبدأ من السعر الأساسي ويمكن تخفيضه بسعر بيع أقل منه.
      </p>
      <select id="bp_sel" style="width:100%">${branches.map(b => `<option value="${b.id}" ${b.id === lkBranch ? 'selected' : ''}>${esc(b.name_ar)}</option>`).join('')}</select>
    </div>
    <div class="set-card" style="margin-bottom:12px"><h3>📏 الأحجام</h3>
      ${(sizes.data || []).length === 0 ? '<div class="empty" style="padding:8px">لا توجد أحجام</div>' : `<div class="table-wrap"><table class="tbl"><thead><tr><th>المنتج</th><th>الحجم</th><th>الأساسي</th><th>سعر الفرع</th><th>سعر البيع</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${sizes.data.map(s => { const r = sizeRow(s.id); return `<tr>
        <td data-label="المنتج">${esc(itemName(s.item_id))}</td><td data-label="الحجم">${esc(s.label_ar)}</td>
        <td data-label="الأساسي" dir="ltr">${money2(s.price)}</td>
        <td data-label="سعر الفرع" dir="ltr">${r ? money2(r.price) : '—'}</td>
        <td data-label="سعر البيع" dir="ltr">${r && r.sale_price != null ? money2(r.sale_price) : '—'}</td>
        <td data-label="الحالة">${!r ? '<span style="color:var(--ink2)">غير متاح</span>' : r.is_available ? '<span style="color:var(--ok)">متاح</span>' : '<span style="color:var(--err)">موقوف</span>'}</td>
        <td data-label=""><button class="btn out sm" data-bp="size" data-id="${s.id}">✏️</button></td></tr>`; }).join('')}
      </tbody></table></div>`}
    </div>
    <div class="set-card" style="margin-bottom:12px"><h3>🧀 الإضافات</h3>
      ${(addons.data || []).length === 0 ? '<div class="empty" style="padding:8px">لا توجد إضافات</div>' : `<div class="table-wrap"><table class="tbl"><thead><tr><th>الإضافة</th><th>الأساسي</th><th>سعر الفرع</th><th>سعر البيع</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${addons.data.map(a => { const r = addonRow(a.id); return `<tr>
        <td data-label="الإضافة">${esc(a.name_ar)}</td>
        <td data-label="الأساسي" dir="ltr">${money2(a.price)}</td>
        <td data-label="سعر الفرع" dir="ltr">${r ? money2(r.price) : '—'}</td>
        <td data-label="سعر البيع" dir="ltr">${r && r.sale_price != null ? money2(r.sale_price) : '—'}</td>
        <td data-label="الحالة">${!r ? '<span style="color:var(--ink2)">غير متاحة</span>' : r.is_available ? '<span style="color:var(--ok)">متاحة</span>' : '<span style="color:var(--err)">موقوفة</span>'}</td>
        <td data-label=""><button class="btn out sm" data-bp="addon" data-id="${a.id}">✏️</button></td></tr>`; }).join('')}
      </tbody></table></div>`}
    </div>`;

  $('bp_sel').onchange = e => { lkBranch = e.target.value; VIEWS['branch-pricing'](v); };

  const priceEditor = (kind, target, base, existing) => {
    const isSize = kind === 'size';
    openModal(`<h2>${isSize ? 'سعر الحجم' : 'سعر الإضافة'} في الفرع <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
      <p style="font-size:13px;color:var(--ink2)">${esc(target.name)} — السعر الأساسي: <b dir="ltr">${money2(base)}</b></p>
      <label>سعر الفرع * <small>0 أو أكثر</small></label><input id="bp_price" type="number" min="0" step="0.5" value="${existing ? existing.price : base}">
      <label>سعر البيع (اختياري) <small>يجب أن يكون أقل من سعر الفرع</small></label><input id="bp_sale" type="number" min="0" step="0.5" value="${existing?.sale_price ?? ''}">
      <label class="toggle" style="margin-top:12px"><span>متاح في هذا الفرع</span><input type="checkbox" id="bp_av" ${existing ? (existing.is_available ? 'checked' : '') : 'checked'}></label>
      <div class="row" style="margin-top:14px"><button class="btn pri big" id="bp_save">💾 حفظ</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);
    $('bp_save').onclick = async () => {
      const btn = $('bp_save');
      const price = lkNum($('bp_price').value), sale = lkNum($('bp_sale').value);
      if (price === null || !Number.isFinite(price) || price < 0) return toast('سعر الفرع يجب أن يكون رقمًا 0 أو أكثر', 'err');
      if (sale !== null) {
        if (!Number.isFinite(sale) || sale < 0) return toast('سعر البيع غير صالح', 'err');
        if (isSize && sale <= 0) return toast('سعر البيع للحجم يجب أن يكون أكبر من 0', 'err');
        if (sale >= price) return toast('سعر البيع يجب أن يكون أقل من سعر الفرع', 'err');
      }
      const avail = $('bp_av').checked;
      const payload = isSize
        ? { branch_id: lkBranch, size_id: target.id, price, sale_price: sale, is_available: avail }
        : { branch_id: lkBranch, addon_id: target.id, price, sale_price: sale, is_available: avail };
      btn.disabled = true; btn.textContent = '⏳ حفظ...';
      try {
        const r = isSize
          ? await sb.from('branch_item_sizes').upsert(payload, { onConflict: 'branch_id,size_id' }).select('size_id')
          : await sb.from('branch_addons').upsert(payload, { onConflict: 'branch_id,addon_id' }).select('addon_id');
        if (r.error) throw r.error;
        if (!r.data?.length) throw new Error('لم يُحفظ السعر: ليست لديك صلاحية');
        closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
      } catch (e) { fail(e, hpErrMsg(e)); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
      VIEWS['branch-pricing'](v);
    };
  };
  v.onclick = e => {
    const b = e.target.closest('[data-bp]'); if (!b) return;
    if (b.dataset.bp === 'size') {
      const s = sizes.data.find(x => x.id === b.dataset.id);
      return priceEditor('size', { id: s.id, name: `${itemName(s.item_id)} — ${s.label_ar}` }, s.price, sizeRow(s.id));
    }
    const a = addons.data.find(x => x.id === b.dataset.id);
    return priceEditor('addon', { id: a.id, name: a.name_ar }, a.price, addonRow(a.id));
  };
};


/* ═══════════════════════════════════════════════════
   SECTION 16c · جوائز العجلة والخدش
   تُدار عبر Edge Function الإدارية admin-api، لأن جدول reward_prizes مغلق
   بسياسة deny لكل المستخدمين، والخادم يتحقق من الدور قبل كل عملية.
   القواعد هنا مطابقة لقواعد الخادم حتى يظهر الخطأ قبل الإرسال.
   ═══════════════════════════════════════════════════ */
const RP_GAMES = { wheel: 'عجلة الحظ', scratch: 'بطاقة الخدش' };
const RP_TYPES = { none: 'لا جائزة', percent: 'خصم نسبة', fixed: 'خصم مبلغ ثابت', free_delivery: 'توصيل مجاني', free_item: 'صنف مجاني', free_addon: 'إضافة مجانية' };

async function rpCall(body) {
  const { data, error } = await sb.functions.invoke('admin-api', { body });
  if (error) throw new Error(error.message || 'تعذر الاتصال بخدمة الإدارة');
  if (data && data.error) throw new Error(data.error);
  return data && data.data !== undefined ? data.data : data;
}

VIEWS['reward-prizes'] = async v => {
  let prizes;
  try { prizes = await rpCall({ action: 'list_reward_prizes' }) || []; }
  catch (e) { v.innerHTML = `<div class="empty">تعذر تحميل جوائز العجلة: ${esc(e.message)}</div>`; return; }
  const [items, addons] = await Promise.all([
    sb.from('menu_items').select('id,name_ar').order('name_ar'),
    sb.from('addons').select('id,name_ar').order('name_ar')
  ]);
  if (items.error || addons.error) { v.innerHTML = `<div class="empty">تعذر تحميل الأصناف: ${esc(hpErrMsg(items.error || addons.error))}</div>`; return; }
  const itemName = id => items.data.find(x => x.id === id)?.name_ar || '(محذوف)';
  const addonName = id => addons.data.find(x => x.id === id)?.name_ar || '(محذوفة)';
  const targetOf = p => p.reward_type === 'free_item' ? itemName(p.reward_item_id) : p.reward_type === 'free_addon' ? addonName(p.reward_addon_id) : '';

  // احتمال كل جائزة داخل لعبتها (من الأوزان الفعلية)
  const totals = {};
  prizes.forEach(p => { if (p.is_active) totals[p.game_type] = (totals[p.game_type] || 0) + Number(p.weight || 0); });

  v.innerHTML = `
    <div class="set-card" style="margin-bottom:12px">
      <h3>🎡 جوائز العجلة والخدش</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px">
        الوزن يحدد فرصة ظهور الجائزة مقارنة بغيرها في نفس اللعبة. الجائزة الموقوفة لا تظهر للعميل.
        تُحفظ عبر الخادم الذي يتحقق من دورك قبل كل عملية.
      </p>
      <button class="btn pri" id="rp_new">+ جائزة جديدة</button>
    </div>
    ${Object.keys(RP_GAMES).map(g => {
      const rows = prizes.filter(p => p.game_type === g);
      return `<div class="set-card" style="margin-bottom:12px"><h3>${RP_GAMES[g]} (${rows.length})</h3>
        ${rows.length === 0 ? '<div class="empty" style="padding:8px">لا توجد جوائز</div>' : `<div class="table-wrap"><table class="tbl"><thead><tr><th>الجائزة</th><th>النوع</th><th>القيمة</th><th>الوزن</th><th>الفرصة</th><th>صلاحية القسيمة</th><th>الحالة</th><th></th></tr></thead><tbody>
        ${rows.map(p => `<tr>
          <td data-label="الجائزة"><b>${esc(p.label_ar)}</b> <small dir="ltr" style="color:var(--ink2)">${esc(p.prize_key)}</small>${targetOf(p) ? `<br><small style="color:var(--ink2)">${esc(targetOf(p))}</small>` : ''}</td>
          <td data-label="النوع">${esc(RP_TYPES[p.reward_type] || p.reward_type)}</td>
          <td data-label="القيمة" dir="ltr">${p.reward_type === 'percent' ? `${esc(p.value)}%` : esc(p.value)}</td>
          <td data-label="الوزن" dir="ltr">${esc(p.weight)}</td>
          <td data-label="الفرصة" dir="ltr">${p.is_active && totals[g] ? ((Number(p.weight) / totals[g]) * 100).toFixed(1) + '%' : '—'}</td>
          <td data-label="الصلاحية">${esc(p.voucher_valid_days)} يوم</td>
          <td data-label="الحالة">${hpBadge(p.is_active ? { l: 'مفعّلة', c: 'var(--ok)' } : { l: 'موقوفة', c: 'var(--ink2)' })}</td>
          <td data-label=""><div class="row" style="gap:6px"><button class="btn out sm" data-rp="edit" data-id="${p.id}">✏️</button>
          <button class="btn out sm ${p.is_active ? 'wr' : 'ok'}" data-rp="toggle" data-id="${p.id}">${p.is_active ? 'إيقاف' : 'تفعيل'}</button></div></td>
        </tr>`).join('')}</tbody></table></div>`}
      </div>`;
    }).join('')}`;

  const editor = p => {
    const isNew = !p;
    const d = p || { game_type: 'wheel', prize_key: '', label_ar: '', reward_type: 'percent', value: 0, weight: 1, voucher_valid_days: 30, reward_item_id: null, reward_addon_id: null, is_active: true };
    openModal(`<h2>${isNew ? 'جائزة جديدة' : 'تعديل الجائزة'} <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
      <label>اللعبة *</label><select id="rp_game" ${isNew ? '' : 'disabled'}>${Object.entries(RP_GAMES).map(([k, l]) => `<option value="${k}" ${d.game_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label>المعرّف الداخلي * <small>حروف إنجليزية صغيرة وأرقام وشرطة، ويجب أن يكون فريدًا داخل اللعبة</small></label><input id="rp_key" dir="ltr" maxlength="50" value="${esc(d.prize_key)}" ${isNew ? '' : 'readonly'}>
      <label>اسم الجائزة الظاهر *</label><input id="rp_label" maxlength="80" value="${esc(d.label_ar)}">
      <label>نوع الجائزة *</label><select id="rp_type">${Object.entries(RP_TYPES).map(([k, l]) => `<option value="${k}" ${d.reward_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label>القيمة <small>نسبة من 0 إلى 100 للخصم بالنسبة، أو مبلغ بالجنيه</small></label><input id="rp_value" type="number" min="0" step="0.5" value="${d.value}">
      <div id="rp_item_wrap"><label>الصنف المجاني *</label><select id="rp_item"><option value="">— اختر —</option>${items.data.map(x => `<option value="${x.id}" ${d.reward_item_id === x.id ? 'selected' : ''}>${esc(x.name_ar)}</option>`).join('')}</select></div>
      <div id="rp_addon_wrap"><label>الإضافة المجانية *</label><select id="rp_addon"><option value="">— اختر —</option>${addons.data.map(x => `<option value="${x.id}" ${d.reward_addon_id === x.id ? 'selected' : ''}>${esc(x.name_ar)}</option>`).join('')}</select></div>
      <label>الوزن * <small>رقم أكبر من صفر، يحدد فرصة الظهور</small></label><input id="rp_weight" type="number" min="0.0001" step="0.1" value="${d.weight}">
      <label>مدة صلاحية القسيمة بالأيام (1 - 365)</label><input id="rp_days" type="number" min="1" max="365" value="${d.voucher_valid_days}">
      <label class="toggle" style="margin-top:12px"><span>مفعّلة</span><input type="checkbox" id="rp_active" ${d.is_active ? 'checked' : ''}></label>
      <div class="row" style="margin-top:14px"><button class="btn pri big" id="rp_save">💾 حفظ</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>`);

    const syncType = () => {
      const t = $('rp_type').value;
      $('rp_item_wrap').classList.toggle('hide', t !== 'free_item');
      $('rp_addon_wrap').classList.toggle('hide', t !== 'free_addon');
    };
    syncType(); $('rp_type').onchange = syncType;

    $('rp_save').onclick = async () => {
      const btn = $('rp_save');
      const game = $('rp_game').value, key = $('rp_key').value.trim(), label = $('rp_label').value.trim();
      const type = $('rp_type').value, value = Number($('rp_value').value), weight = Number($('rp_weight').value);
      const days = Number($('rp_days').value);
      const itemId = type === 'free_item' ? ($('rp_item').value || null) : null;
      const addonId = type === 'free_addon' ? ($('rp_addon').value || null) : null;
      if (!/^[a-z0-9_-]{2,50}$/.test(key)) return toast('المعرّف الداخلي يجب أن يكون 2 إلى 50 حرفًا إنجليزيًا صغيرًا أو رقمًا أو شرطة', 'err');
      if (!label || label.length > 80) return toast('اسم الجائزة مطلوب ولا يتجاوز 80 حرفًا', 'err');
      if (!Number.isFinite(value) || value < 0) return toast('القيمة يجب أن تكون 0 أو أكثر', 'err');
      if (type === 'percent' && value > 100) return toast('نسبة الخصم لا تتجاوز 100%', 'err');
      if (!Number.isFinite(weight) || weight <= 0) return toast('الوزن يجب أن يكون أكبر من صفر', 'err');
      if (!Number.isInteger(days) || days < 1 || days > 365) return toast('مدة القسيمة بين 1 و 365 يومًا', 'err');
      if (type === 'free_item' && !itemId) return toast('اختر الصنف المجاني', 'err');
      if (type === 'free_addon' && !addonId) return toast('اختر الإضافة المجانية', 'err');
      if (prizes.some(x => x.game_type === game && x.prize_key === key && (!p || x.id !== p.id))) return toast('يوجد جائزة بنفس المعرّف في هذه اللعبة', 'err');
      const payload = { game_type: game, prize_key: key, label_ar: label, reward_type: type, value, weight,
        voucher_valid_days: days, reward_item_id: itemId, reward_addon_id: addonId, is_active: $('rp_active').checked, metadata: {} };
      if (p) payload.id = p.id;
      btn.disabled = true; btn.textContent = '⏳ حفظ...';
      try {
        const saved = await rpCall({ action: 'save_reward_prize', ...payload });
        if (!saved || !saved.id) throw new Error('لم يؤكد الخادم حفظ الجائزة');
        closeModal(); toast('تم الحفظ في قاعدة البيانات', 'ok');
      } catch (e) { fail(e, e.message === 'INVALID_REWARD_PRIZE' ? 'بيانات الجائزة غير صالحة حسب قواعد الخادم' : e.message); btn.disabled = false; btn.textContent = '💾 حفظ'; return; }
      VIEWS['reward-prizes'](v);
    };
  };

  $('rp_new').onclick = () => editor(null);
  v.onclick = async e => {
    const b = e.target.closest('[data-rp]'); if (!b) return;
    const p = prizes.find(x => x.id === b.dataset.id);
    if (b.dataset.rp === 'edit') return editor(p);
    b.disabled = true;
    try {
      const payload = { ...p, is_active: !p.is_active, metadata: p.metadata || {} };
      delete payload.created_at;
      const saved = await rpCall({ action: 'save_reward_prize', ...payload });
      if (!saved || !saved.id) throw new Error('لم يؤكد الخادم التحديث');
      toast('تم التحديث', 'ok');
    } catch (err) { fail(err, err.message); }
    VIEWS['reward-prizes'](v);
  };
};

/* ═══════════════════════════════════════════════════
   SECTION 17 · مركز الحذف
   حذف نهائي لأي سجل تديره الإدارة، مع فحص الارتباطات أولًا:
   - block:true  → يُمنع الحذف إذا وُجدت ارتباطات (الحذف يكسر تاريخًا مهمًا أو يفقد بيانات).
   - block:false → الارتباطات التعريفية تُحذف أو تُفصل تلقائيًا، ويُعرض عددها قبل التأكيد.
   - إذا تعذّر التحقق من ارتباط (الجدول غير مقروء للإدارة) يُمنع الحذف، ولا يُفترض أن الارتباط غير موجود.
   بعد الحذف نعيد قراءة الصف، ولا نعتبر الحذف ناجحًا إلا إذا اختفى فعلًا.
   ═══════════════════════════════════════════════════ */
async function dcCount(table, filters) {
  let q = sb.from(table).select('*', { count: 'exact', head: true });
  for (const [k, v] of Object.entries(filters)) q = q.eq(k, v);
  const r = await q;
  if (r.error) throw r.error;
  return Number.isFinite(r.count) ? r.count : (r.data || []).length;
}
/* فحص يُرجع قائمة شروط. أي خطأ في فحص يُظهر كشرط مانع. */
async function dcSafe(label, table, filters, block, note) {
  try { return { label, n: await dcCount(table, filters), block, note }; }
  catch (e) { return { label, n: 1, block: true, error: true, note: 'تعذر التحقق من هذا الارتباط، لذلك الحذف متوقف: ' + hpErrMsg(e) }; }
}

        <div dir="auto"><b>${esc(ent.name(row))}</b> <small dir="ltr" style="color:var(--ink2)">${esc((ent.keyColumns || ['id']).map(k => String(row[k]).slice(0, 8)).join(' · '))}</small></div>

async function dcCleanupRelations(entityKey, row) {
  const jobs = {
    offers: [
      ['menu_promotion_items',{promotion_id:row.id}], ['promotion_badges',{promotion_id:row.id}],
      ['promotion_display_placements',{promotion_id:row.id}]
    ],
    badges: [
      ['menu_item_badges',{badge_id:row.id}], ['category_badges',{badge_id:row.id}], ['promotion_badges',{badge_id:row.id}]
    ],
    pages: [],
    categories: [['category_badges',{category_id:row.id}]],
    products: [
      ['item_sizes',{item_id:row.id}], ['item_addons',{item_id:row.id}],
      ['menu_item_badges',{item_id:row.id}], ['addon_groups',{item_id:row.id}]
    ],
    addons: [['item_addons',{addon_id:row.id}], ['branch_addons',{addon_id:row.id}]],
    sizes: [['branch_item_sizes',{size_id:row.id}]],
    branches: [
      ['branch_menu_items',{branch_id:row.id}], ['branch_item_sizes',{branch_id:row.id}], ['branch_addons',{branch_id:row.id}]
    ],
    blocks: [['homepage_block_items',{block_id:row.id}], ['promotion_display_placements',{block_id:row.id}]],
    addonGroups: [['addon_group_options',{group_id:row.id}]],
    secretCodes: [['secret_menu_code_items',{code_id:row.id}]]
  }[entityKey] || [];
  for (const [table, filters] of jobs) {
    let q = sb.from(table).delete();
    for (const [k,val] of Object.entries(filters)) q = q.eq(k,val);
    const result = await q;
    if (result.error) throw new Error(`تعذر تنظيف الارتباطات من ${table}: ${hpErrMsg(result.error)}`);
  }
  // هذه سجلات محتوى مستقلة؛ نفصل مرجع العرض بدل حذف البنر أو الإعلان نفسه.
  if (entityKey === 'offers') {
    for (const table of ['homepage_banners','homepage_announcements']) {
      const result = await sb.from(table).update({promotion_id:null}).eq('promotion_id',row.id);
      if (result.error) throw new Error(`تعذر فصل العرض عن ${table}: ${hpErrMsg(result.error)}`);
    }
    const result = await sb.from('menu_promotions').update({promotion_page_id:null}).eq('id',row.id);
    // تجاهل فقط خطأ العمود غير الموجود؛ أما أخطاء الصلاحيات/الاتصال فتوقف العملية.
    if (result.error && !/column .*promotion_page_id.* does not exist/i.test(result.error.message||'')) throw result.error;
  }
  if (entityKey === 'pages') {
    const result = await sb.from('menu_promotions').update({promotion_page_id:null}).eq('promotion_page_id',row.id);
    if (result.error) throw result.error;
  }
}

async function dcOpenConfirm(ent, row, v, entityKey = dcCurrent) {
  openModal(`<h2>حذف نهائي <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2><div class="empty" style="padding:12px">⏳ جاري فحص الارتباطات...</div>`);
  let checks;
  try { checks = await ent.checks(row.id, row); }
  catch (e) { openModal(`<h2>تعذر الفحص</h2><div class="empty">${esc(hpErrMsg(e))}</div><div class="row" style="margin-top:12px"><button class="btn out big" onclick="closeModal()">إغلاق</button></div>`); return; }
  const blockers = checks.filter(c => c.block && c.n > 0);
  const infos = checks.filter(c => !c.block && c.n > 0);
  const lines = checks.map(c => `<div class="row" style="justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span>${esc(c.label)}${c.note ? `<br><small style="color:var(--ink2)">${esc(c.note)}</small>` : ''}</span>
      <b style="color:${c.error ? 'var(--err)' : c.n > 0 ? (c.block ? 'var(--err)' : 'var(--warn)') : 'var(--ok)'}">${c.error ? 'تعذر التحقق' : c.n}</b></div>`).join('');

  const canDelete = blockers.length === 0;
  const rowFilters = Object.fromEntries((ent.keyColumns || ['id']).map(k => [k, row[k]]));
  openModal(`<h2>حذف «${esc(ent.name(row))}» نهائيًا <button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></h2>
    <p style="font-size:13px;color:var(--ink2)">الحذف نهائي. سيجري حذف روابط الإعدادات التابعة المعروفة أولًا، مع الحفاظ على سجلات الطلبات والاستخدامات التاريخية.</p>
    ${lines || '<div class="empty" style="padding:8px">لا توجد ارتباطات</div>'}
    ${canDelete ? '' : `<div class="empty" style="margin-top:12px;border:1px solid var(--err);border-radius:10px;padding:12px;color:var(--err)">
      لا يمكن حذف هذا السجل لوجود ${blockers.length} مانع. ${blockers.map(b => esc(b.note || b.label)).join(' · ')}</div>`}
    ${canDelete ? `<label class="toggle" style="margin-top:14px"><span>أفهم أن الحذف نهائي ولا يمكن التراجع عنه</span><input type="checkbox" id="dc_ok"></label>
      <div class="row" style="margin-top:14px"><button class="btn dng big" id="dc_go" disabled>🗑️ حذف نهائي</button><button class="btn out big" onclick="closeModal()">إلغاء</button></div>` :
      `<div class="row" style="margin-top:14px"><button class="btn out big" onclick="closeModal()">إغلاق</button></div>`}`);

  if (!canDelete) return;
  $('dc_ok').onchange = e => { $('dc_go').disabled = !e.target.checked; };
  $('dc_go').onclick = async () => {
    const btn = $('dc_go'); btn.disabled = true; btn.textContent = '⏳ جاري الحذف...';
    try {
      await dcCleanupRelations(entityKey, row);
      let delQuery = sb.from(ent.table).delete();
      for (const [k, value] of Object.entries(rowFilters)) delQuery = delQuery.eq(k, value);
      const del = await delQuery.select('*');
      if (del.error) throw del.error;
      if (!del.data || del.data.length === 0) throw new Error('لم يتم الحذف: ليست لديك صلاحية أو السجل غير موجود');
      let againQuery = sb.from(ent.table).select('*');
      for (const [k, value] of Object.entries(rowFilters)) againQuery = againQuery.eq(k, value);
      const again = await againQuery;
      if (again.error) throw again.error;
      if ((again.data || []).length > 0) throw new Error('الحذف لم يُؤكَّد: السجل ما زال موجودًا عند إعادة القراءة');
      closeModal();
      toast('تم الحذف النهائي وتأكيده من قاعدة البيانات', 'ok');
    } catch (err) {
      fail(err, hpErrMsg(err));
      btn.disabled = false; btn.textContent = '🗑️ حذف نهائي';
      return;
    }
    VIEWS['delete-center'](v);
  };
}
